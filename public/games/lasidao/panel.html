  <div id="las-exchange-modal" class="modal las-exchange-modal" hidden>

  <div id="las-robbery-modal" class="modal las-robbery-modal" hidden>

  <div id="las-redraw-modal" class="modal las-redraw-modal" hidden>

  <div id="las-exile-modal" class="modal las-exile-modal" hidden>

  <div id="las-expand-modal" class="modal las-expand-modal" hidden>

          <button type="button" class="las-expand-option" data-direction="resource">

          </button>

      </div>
      <div class="las-expand-foot row las-actions">
        <button id="btn-las-expand-confirm" type="button" data-i18n="lasidao.expandConfirm" disabled>确认扩容</button>
        <button id="btn-las-expand-cancel" type="button" class="secondary" data-i18n="lasidao.cancel">取消</button>

    </div>

          <div id="las-board-special" class="las-board las-board-special" data-area="special"></div>
