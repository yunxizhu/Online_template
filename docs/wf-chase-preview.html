<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>追击攻击命令</title>
<style>
html,body{margin:0;background:#1b1714;overflow:hidden;}
#warfactory-canvas{display:block;}
</style></head><body class="phase-game">
<div id="game-panels"></div>
<canvas id="warfactory-canvas" width="960" height="600"></canvas>
<script>'use strict';

/**
 * 战争工厂（warfactory）客户端：水墨渲染 + RTS 操作。
 *
 * 服务端权威：全部单位/工厂状态来自 game:rt 快照（10Hz），本端做插值平滑；
 * 玩家只上报离散指令（框选后右键进攻移动），走 game:rtInput 通道。
 * 画面：宣纸底 + 淡墨远山 + 竹石点缀；单位造型沿用玩家手绘模型并水墨化。
 */

window.WarFactoryUi = (function () {
  const TAU = Math.PI * 2;

  // ==== 世界与视口 ====
  let WORLD_W = 2400;
  let WORLD_H = 1600;
  let VIEW_W = 1280; // 当前镜头覆盖的世界宽：滚轮缩放会实时改变它
  let VIEW_H = 800; // 当前镜头覆盖的世界高：由容器纵横比 × 缩放决定
  const ZOOM_MIN = 0.5; // 滚轮最远倍率（相对 1 倍镜头）
  const ZOOM_MAX = 2.2; // 滚轮最近倍率
  const MINIMAP_W = 300; // 小地图逻辑尺寸（与面板 canvas 的 width/height 一致）
  const MINIMAP_H = 200;
  // 画布 HUD 的安全边距：地图上有浮层（菜单按钮 / 指挥栏）时，别把 HUD 画到浮层底下。
  // 由 measureHudInsets() 按真实 DOM 尺寸算出来，量不到就退回默认的 14。
  const HUD_PAD = 14;
  let hudPadTop = HUD_PAD; // 左上角 HUD（科技点面板）的上边距
  let hudPadTopRight = HUD_PAD; // 右上角 HUD（兵力提示）的上边距
  let hudPadBot = HUD_PAD; // 左下角 HUD（集结点 / 点兵 / 短提示）的下边距
  let hudInsetsStale = true; // 布局变动后置位，下一帧重量一次

  // ==== 建筑半径（与服务端 consts 对齐；服务端下发后以 consts 为准）====
  const LAB_R_FALLBACK = 46;
  const HQ_R_FALLBACK = 64;
  function labR() {
    return (meta && meta.consts && meta.consts.labR) || LAB_R_FALLBACK;
  }
  function hqR() {
    return (meta && meta.consts && meta.consts.hqR) || HQ_R_FALLBACK;
  }

  // ==== 水墨配色 ====
  const INK = '#2a2620';
  const PAPER = '#ece3cd';
  const PAPER_DEEP = '#e3d8bd';
  const TYPE_ACCENT = {
    warrior: '#8f3b2e',
    shield: '#3d5a78',
    ranger: '#4a453c',
    burst: '#a3742a',
    burn: '#9c3b2c',
    laser: '#2f6f7a',
  };
  const LEVEL_CHAR = { 1: '初', 2: '中', 3: '高' };
  const TIER_CHAR = { 1: '初', 2: '中', 3: '高' };

  /**
   * 单位视觉缩放：单位绘制函数用的是「设计尺寸」（初级约 24px、高级盾卫约 60px），
   * 世界放大到 4320×2880 后战场上显得偏小，这里统一放大。
   * 仅影响观感 —— 碰撞、射程、分离仍按服务端 STATS[type].r（9~10）计算。
   */
  const UNIT_VIS_SCALE = 1.1;

  /**
   * 兵种基础体型系数（叠在 UNIT_VIS_SCALE 之上）。
   * 锐士原本身形又瘦又小，只有盾卫的四成不到；×1.4 之后体量约为盾卫的七成，
   * 满足「锐士的基础体型至少是盾卫的一半」。
   * 同样只影响观感：碰撞半径仍是服务端 STATS[type].r。
   */
  const UNIT_BODY_SCALE = { warrior: 1.4, shield: 1, ranger: 1, burst: 1, burn: 1, laser: 1 };
  function bodyScaleOf(type) {
    return UNIT_BODY_SCALE[type] || 1;
  }

  /**
   * 归属底色盘的不透明度：单位脚下、工厂厂区、总部台基都压一层该方阵营色
   * （红/蓝/黄/绿，色值来自服务端 COLORS），60% 透明便于同屏分辨归属。
   */
  const OWNER_PAD_ALPHA = 0.6;
  /** 底盘描边用的亮边色：纸色偏暖，压 60% 透明的色块上做一圈收口 */
  const PAD_EDGE = '#f6efdd';

  const CALLOUT_FONT = '"STKaiti","KaiTi","Noto Serif SC","SimSun",serif';

  let net = null;
  let meta = null;
  let meId = null;
  let isSpectator = false;
  let trFn = null;

  let panel = null;
  let canvas = null;
  let ctx = null;
  let dpr = 1;
  let cssW = 1280;
  let cssH = 800;
  let zoom = 1; // 屏幕像素 / 世界像素（绘制用）
  let zoomMul = 1; // 滚轮累计倍率（相对 1 倍镜头），真实缩放由 applyZoom() 换算

  // ==== 底部指挥栏（小地图 ｜ 单位粗览 ｜ 单位详情）====
  let miniCanvas = null; // 左栏：小地图独立画布（不再画在主战场上）
  let miniCtx = null;
  let miniDpr = 1;
  let miniDrag = false; // 小地图上按住拖动可连续跳转镜头
  let ovBox = null; // 中栏：单位粗览网格容器
  let ovCountEl = null;
  let ovSecEl = null; // 中栏整段（section）：常驻，未选中时显示空态提示
  const ovEls = new Map(); // unit id → {tile, glyph, tier, hpFill, hpBar} 复用节点
  let ovKey = ''; // 结构签名：变化才重建 DOM（否则每帧重建会卡）
  let selfEl = null; // 右栏：我方概况
  const selfEls = {}; // 我方概况各字段节点
  let selfKey = '';
  let wdtTitleEl = null;
  let wdtCountEl = null;
  let titleEl = null;
  let statusEl = null;
  let cmdbarEl = null; // 底部指挥栏（浮在地图下沿）：画布 HUD 要躲开它
  let helpBtnEl = null; // 右上角「？」：规则浮层的开关
  let helpEl = null; // 规则浮层本体（默认收起）

  let active = false;
  let raf = 0;
  let lastFrame = 0;
  let rtBound = false;
  let startedAt = 0;
  // 同一局的稳定指纹：用于区分「同局 repeated render」与「开新局」，避免每次 game:state 都重置镜头/清空单位
  let lastMatchKey = null;

  // ==== 运行时状态 ====
  let lastSnap = null;
  const units = new Map(); // id → 可绘制单位（插值）
  let factoriesView = []; // {id,x,y,level,home,owner,capBy,capProg,prodProg,contested,pt,hp,hpMax,ecd}
  let labsView = []; // {id,x,y,owner,hp,hpMax}
  let hqView = []; // {id,x,y,owner,hp,hpMax,down}
  let rpView = []; // 各玩家科技点（与 meta.players 同序）
  let rpAccView = []; // 各玩家「距下次结算」的累积毫秒（与 meta.players 同序）：HUD 进度条用
  let ucView = []; // 各玩家当前部队数（与 meta.players 同序）：兵力预警用
  const selection = new Set();
  let selFacId = 0; // 当前选中的本方工厂：右键为其设置集结点（0 = 未选中）
  let selHqId = 0; // 当前选中的本方总部：右侧面板展示亲兵进化（0 = 未选中）
  /**
   * 只读查看的「非己方」目标：{ kind: 'unit' | 'fac' | 'hq' | 'lab', id }。
   * 只能左键逐个点选（框选永远只圈自己的部队），面板只展示数据、不出任何升级/指令按钮。
   * 与 selection / selFacId / selHqId 互斥：点别人的东西会先清空自己这边的选择。
   */
  let peek = null;
  /**
   * 数字键编队（0-9）：纯本地状态，不发给服务端（编队只是玩家自己的收藏夹）。
   * 编号 → 我方部队 id 数组（升序，「第一个单位」因此稳定可预期）。
   * 纯数字键 = 选中该编队；同编号连按两下 = 镜头飞到编队第一支部队。
   */
  const squads = new Map();
  const SQUAD_DBL_MS = 350; // 「连按两下」的判定窗口，超时就算两次独立按键
  let squadTapNum = -1; // 上一次按下的编号（-1 = 没有）
  let squadTapAt = 0; // 上一次按下的时刻
  const hudHints = []; // 屏幕空间短提示（编队反馈用）：{ text, born, ttl }
  const rallyById = new Map(); // 工厂 id → {x,y} 集结点（服务端权威）
  const UNIT_CN = { warrior: '锐士', shield: '盾卫', ranger: '游侠', burst: '轰击', burn: '燎原', laser: '激光兵' };
  const cam = { x: 0, y: 0 };
  const keys = Object.create(null);
  const boxSel = { on: false, x0: 0, y0: 0, x1: 0, y1: 0, add: false };
  /**
   * 中键拖动平移地图：按住鼠标中键拖动 = 拖着地图走（抓取式平移，标准 RTS 手感）。
   * 浏览器原本的「中键自动滚动」已在 bindInput 里被 preventDefault 吃掉，
   * 所以中键在这块区域只做平移，不再有网页自带行为。
   */
  const pan = { on: false, x: 0, y: 0, moved: 0 };
  const effects = []; // 特效队列（短命：枪口焰 / 命中炸开 / 墨爆 …）
  /**
   * 地面弹痕：命中处留下的不规则墨渍，谁都看得见「这里刚被打过」。
   * 单独一队而不是塞进 effects —— 它要画在单位与建筑的**下面**（贴地），
   * 且寿命比炸开动画长得多（9 秒淡出），绘制顺序与淘汰节奏都不一样。
   */
  const groundMarks = [];
  const GROUND_MARK_TTL = 9000;
  const GROUND_MARK_MAX = 180; // 上限：满了从最老的丢，避免长时间对局无限堆积
  // 弹痕配色。注意：这两个不透明度是弹痕专用，别与下方选中光环的 0.22 撞车
  // （scripts/warfactory-client-check.js 就是靠「有没有 0.22 同色填充」判断脚下有没有光环的）。
  const MARK_INK_ALPHA = 0.28;
  const MARK_TINT_ALPHA = 0.17;
  const moveMarkers = [];
  const attackMarkers = []; // 右键锁定攻击目标的落点提示
  const rallyFx = []; // 设置集结点时的落点特效
  /**
   * 灼烧地形（燎原喷出的火场）：服务端权威，每帧从快照 `fr` 整段替换。
   * 与前两个队列不同，这里**不做本地插值** —— 火场的位置、半径、剩余寿命全听服务端，
   * 客户端只负责「按剩余寿命把火画得越来越小越来越淡」，这样火焰一停，画面上的火
   * 与服务端的真实判定同时消失，不会出现「看着还有火、踩上去却不掉血」。
   * 元素：{ x, y, r, ttl, at, lifeMs }（ttl = 服务端下发时的剩余寿命，at = 收到的时刻；
   * 绘制时用 `ttl - (now - at)` 自行倒计时，于是 10Hz 快照之间也能连续淡出）。
   * lifeMs 是**这片火自己的**寿命上限（二级 3 秒 / 三级 5.2 秒），衰减按它算。
   */
  const FIRE_LIFE_FALLBACK = 3000; // 快照没带上限时的兜底（按二级算）
  let fires = [];
  let bgCanvas = null;
  let bgReady = false;
  let lastStatus = '';
  let lastHudKey = '';

  // ==== 右侧工厂面板（选中工厂时弹出）====
  let facPanelEl = null;
  const fpEls = {}; // 面板内各节点的缓存
  let facPanelKey = ''; // 结构签名：工厂 id/等级/归属/兵种 变化时重建静态部分
  const UNIT_DESC = {
    warrior: '近战突进，攻守兼备',
    shield: '重甲缓慢，坚不可摧',
    ranger: '远程狙击，薄血长射',
    burst: '曲射抛投，越山轰击',
    burn: '持续喷火；二级起落点留下灼烧地形',
    laser: '锁定越久伤害越高，最高 5 倍',
  };
  const BRANCH_CN = { A: '攻势', B: '守势' };

  // ==== 右侧单位面板（选中部队时弹出；与工厂/总部面板互斥）====
  let unitPanelEl = null;
  const upEls = {}; // 面板内各节点的缓存
  let unitPanelKey = ''; // 结构签名：部队构成变化时重建静态部分
  let unitPanelBar = ''; // 动态签名：血量/状态变化时刷新（避免每帧写 DOM）

  // ==== 地形（元胞自动机：上半生成 + 180° 旋转出下半）====
  let terrainCanvas = null;
  let terrainReady = false;
  let terrainGrid = null; // [gh][gw] → 地形类型 id
  let terrainGW = 0;
  let terrainGH = 0;
  const TERRAIN_CELL = 40; // 每个地形格的世界像素
  // 与服务端（server/games/warfactory/index.js）保持一致的地形常量
  // 类型：0 平原 / 2 山地（不可通行，窄而连续；另有高度 → 遮挡视线与弹道）
  //      3 沼泽（可通行，减速）/ 4 水域（不可通行，大片连续；不遮挡视线）
  const WATER_TOP = 0.28; // 高程低于此值 → 水域
  const SWAMP_TOP = 0.44; // 高程低于此值 → 沼泽，其余为平原
  const SMOOTH_ROUNDS = 6;
  const MAJORITY_ROUNDS = 2;
  const MIN_WATER_BLOB = 10;
  const RIDGE_COUNT = 3;
  const RIDGE_WIDEN = 0.32;

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function tr(key, vars, fallback) {
    if (typeof trFn === 'function') {
      const v = trFn(key, vars);
      if (v && v !== key) return v;
    }
    return fallback;
  }

  function hexAlpha(hex, alpha) {
    const h = String(hex || '').replace('#', '');
    if (h.length !== 6) return 'rgba(42,38,32,' + alpha + ')';
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  /** 每周期产量显示：优先取整（如 2 / 4），非整数保留 1 位（如 1.5） */
  function fmtPerPeriod(v) {
    const n = Number(v) || 0;
    const r = Math.round(n * 10) / 10;
    return Number.isInteger(r) ? String(r) : r.toFixed(1);
  }

  /**
   * 与服务端 unitStats 完全一致的属性推算（客户端展示用）。
   * 服务端：hp = base*tierHp*(B?1.25:1)、dmg = base*tierDmg*(A?1.2:1)、
   *        range = base+tierRange、cd = base*tierCd；移速不随等级变化。
   */
  function unitStatsOf(type, tier, branch) {
    const c = (meta && meta.consts) || {};
    const st = c.stats || {};
    const s = st[type] || { hp: 100, dmg: 10, range: 60, cd: 1, speed: 80, r: 14 };
    const t = clamp(tier, 1, 3) - 1;
    const tierHp = c.tierHp || [1, 1.7, 2.6];
    const tierDmg = c.tierDmg || [1, 1.55, 2.2];
    const tierRange = c.tierRange || [0, 15, 30];
    const tierCd = c.tierCd || [1, 0.88, 0.78];
    const r1 = (v) => Math.round(v * 10) / 10;
    const r2 = (v) => Math.round(v * 100) / 100;
    return {
      hp: Math.round(s.hp * tierHp[t] * (branch === 'B' ? 1.25 : 1)),
      dmg: r1(s.dmg * tierDmg[t] * (branch === 'A' ? 1.2 : 1)),
      range: Math.round(s.range + tierRange[t]),
      cd: r2(s.cd * tierCd[t]),
      speed: s.speed || 80,
      r: s.r || 14,
      splash: s.splash || 0,
      burn: Boolean(s.burn),
      laser: Boolean(s.laser),
    };
  }

  /* ================= 背景（宣纸 + 远山 + 竹石） ================= */

  function makeRng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13;
      s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5;
      s >>>= 0;
      return (s >>> 0) / 4294967296;
    };
  }

  function buildBackground(seed) {
    const c = document.createElement('canvas');
    c.width = WORLD_W;
    c.height = WORLD_H;
    const b = c.getContext('2d');
    const rng = makeRng(seed || 20260922);

    // 宣纸底色
    b.fillStyle = PAPER;
    b.fillRect(0, 0, WORLD_W, WORLD_H);

    // 纸纤维与噪点
    b.fillStyle = 'rgba(90,74,52,0.045)';
    for (let i = 0; i < 5200; i++) {
      b.fillRect(rng() * WORLD_W, rng() * WORLD_H, 1.4, 1.4);
    }
    b.strokeStyle = 'rgba(120,100,70,0.05)';
    b.lineWidth = 1;
    for (let i = 0; i < 160; i++) {
      const x = rng() * WORLD_W;
      const y = rng() * WORLD_H;
      const a = rng() * TAU;
      const l = 14 + rng() * 40;
      b.beginPath();
      b.moveTo(x, y);
      b.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l * 0.25);
      b.stroke();
    }

    // 淡墨远山（三四层）
    const layers = [
      { base: WORLD_H * 0.3, amp: 120, alpha: 0.055, peaks: 6 },
      { base: WORLD_H * 0.42, amp: 90, alpha: 0.075, peaks: 8 },
      { base: WORLD_H * 0.76, amp: 100, alpha: 0.05, peaks: 7 },
    ];
    for (const L of layers) {
      b.beginPath();
      b.moveTo(0, WORLD_H);
      b.lineTo(0, L.base);
      let x = 0;
      let px = 0;
      for (let p = 0; p <= L.peaks; p++) {
        px = x;
        x = ((p + 1) / (L.peaks + 1)) * WORLD_W + (rng() - 0.5) * 160;
        const peakY = L.base - L.amp * (0.4 + rng() * 0.6);
        const midX = (px + x) / 2;
        b.quadraticCurveTo(midX, peakY, x, L.base + (rng() - 0.5) * 30);
      }
      b.lineTo(WORLD_W, WORLD_H);
      b.closePath();
      b.fillStyle = 'rgba(42,38,32,' + L.alpha + ')';
      b.fill();
      // 山脊淡描
      b.strokeStyle = 'rgba(42,38,32,' + (L.alpha + 0.03) + ')';
      b.lineWidth = 2;
      b.stroke();
    }

    // 云雾留白带
    for (let i = 0; i < 5; i++) {
      const y = WORLD_H * (0.2 + rng() * 0.6);
      const h = 40 + rng() * 90;
      const g = b.createLinearGradient(0, y - h / 2, 0, y + h / 2);
      g.addColorStop(0, 'rgba(236,227,205,0)');
      g.addColorStop(0.5, 'rgba(236,227,205,0.5)');
      g.addColorStop(1, 'rgba(236,227,205,0)');
      b.fillStyle = g;
      b.fillRect(0, y - h / 2, WORLD_W, h);
    }

    // 竹丛（固定点位，避开建筑）
    const bamboos = [
      [300, 300], [2100, 1300], [400, 1450], [2000, 200],
      [1150, 620], [1250, 980], [820, 900], [1580, 700],
    ];
    for (const [bx, by] of bamboos) {
      const n = 5 + Math.floor(rng() * 4);
      for (let i = 0; i < n; i++) {
        const x = bx + (rng() - 0.5) * 90;
        const y = by + (rng() - 0.5) * 60;
        const h = 70 + rng() * 70;
        const lean = (rng() - 0.5) * 0.24;
        b.strokeStyle = 'rgba(58,72,52,' + (0.4 + rng() * 0.3) + ')';
        b.lineWidth = 2.6;
        b.beginPath();
        b.moveTo(x, y);
        b.quadraticCurveTo(x + lean * h * 0.5, y - h * 0.6, x + lean * h, y - h);
        b.stroke();
        // 竹节
        b.lineWidth = 1;
        for (let k = 1; k <= 3; k++) {
          const t = k / 4;
          const jx = x + lean * h * t * t;
          const jy = y - h * t;
          b.beginPath();
          b.moveTo(jx - 3, jy);
          b.lineTo(jx + 3, jy);
          b.stroke();
        }
        // 竹叶
        b.fillStyle = 'rgba(58,72,52,0.5)';
        for (let k = 0; k < 4; k++) {
          const lx = x + lean * h + (rng() - 0.5) * 26;
          const ly = y - h - 6 + (rng() - 0.5) * 22;
          const la = -0.6 - rng() * 0.8;
          b.save();
          b.translate(lx, ly);
          b.rotate(la);
          b.beginPath();
          b.ellipse(9, 0, 10, 2.6, 0, 0, TAU);
          b.fill();
          b.restore();
        }
      }
    }

    // 顽石点缀
    for (let i = 0; i < 10; i++) {
      const x = 120 + rng() * (WORLD_W - 240);
      const y = 120 + rng() * (WORLD_H - 240);
      const r = 8 + rng() * 16;
      b.beginPath();
      b.ellipse(x, y, r, r * 0.62, rng() * TAU, 0, TAU);
      b.fillStyle = 'rgba(42,38,32,0.08)';
      b.fill();
      b.strokeStyle = 'rgba(42,38,32,0.3)';
      b.lineWidth = 2;
      b.stroke();
    }

    // 边缘晕染（旧纸感）
    const vg = b.createRadialGradient(
      WORLD_W / 2, WORLD_H / 2, WORLD_H * 0.45,
      WORLD_W / 2, WORLD_H / 2, WORLD_W * 0.72
    );
    vg.addColorStop(0, 'rgba(80,60,30,0)');
    vg.addColorStop(1, 'rgba(80,60,30,0.14)');
    b.fillStyle = vg;
    b.fillRect(0, 0, WORLD_W, WORLD_H);

    bgCanvas = c;
    bgReady = true;
  }

  /* ================= 地形（元胞自动机生成） ================= */

  // 由字符串生成稳定哈希，作为每局地形种子（主机端/加入端一致）
  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  // 基于格子坐标的确定性随机数：保证上下半 180° 对称时笔触一致
  function cellRng(r, c) {
    let s = ((r * 73856093) ^ (c * 19349663) ^ 0x9e3779b9) >>> 0;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return (s >>> 0) / 4294967296;
    };
  }

  /**
   * 生成地形（与服务端算法完全一致）：
   *  1) 仅对「上半地图」做元胞自动机（随机初始高程场 → 多轮邻域扩散平滑 → 起伏地形）；
   *  2) 高程阈值分出 水域 / 沼泽 / 平原，再经众数滤波与小斑块清理，使水域成大片连续；
   *  3) 山体改用「随机游走山脊」，只走正交 4 方向，故窄而连续成脉；
   *  4) 下半地图由上半地图 180° 旋转得到（点对称，行数取偶数保证中缝无缝）。
   * 类型：0 平原 / 2 山地 / 3 沼泽 / 4 水域。
   */
  function buildTerrain(seed) {
    try {
      const rng = makeRng((seed >>> 0) || 1);
      const CELL = TERRAIN_CELL;
      let gw = Math.max(8, Math.round(WORLD_W / CELL));
      let gh = Math.max(6, Math.round(WORLD_H / CELL));
      if (gh % 2 === 1) gh -= 1; // 偶数行：确保上下半 180° 旋转无缝衔接
      const half = gh / 2;

      // 1) 仅生成上半：随机初始高程场
      const elev = [];
      for (let r = 0; r < half; r++) {
        elev[r] = [];
        for (let c = 0; c < gw; c++) elev[r][c] = rng();
      }

      // 2) 元胞自动机：多轮邻域扩散平滑 → 起伏地形（轮数多 → 水域成大片）
      for (let it = 0; it < SMOOTH_ROUNDS; it++) {
        const nx = [];
        for (let r = 0; r < half; r++) {
          nx[r] = [];
          for (let c = 0; c < gw; c++) {
            let sum = 0, n = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const rr = r + dr, cc = c + dc;
                if (rr < 0 || rr >= half || cc < 0 || cc >= gw) continue;
                sum += elev[rr][cc]; n++;
              }
            }
            nx[r][c] = (elev[r][c] * 3 + sum) / (3 + n);
          }
        }
        for (let r = 0; r < half; r++) elev[r] = nx[r];
      }

      // 3) 归一化到 [0,1]，再做对比拉伸，避免平滑后高程挤在中段
      let mn = 1, mx = 0;
      for (let r = 0; r < half; r++) for (let c = 0; c < gw; c++) {
        if (elev[r][c] < mn) mn = elev[r][c];
        if (elev[r][c] > mx) mx = elev[r][c];
      }
      const span = (mx - mn) || 1;
      const GAIN = 1.8; // 拉开分布，使水/山更分明
      for (let r = 0; r < half; r++) for (let c = 0; c < gw; c++) {
        let v = (elev[r][c] - mn) / span;
        v = (v - 0.5) * GAIN + 0.5;
        elev[r][c] = v < 0 ? 0 : v > 1 ? 1 : v;
      }

      // 4) 上半分类：低处水域 / 次低沼泽 / 其余平原
      const top = [];
      for (let r = 0; r < half; r++) {
        top[r] = [];
        for (let c = 0; c < gw; c++) {
          const e = elev[r][c];
          top[r][c] = e < WATER_TOP ? 4 : e < SWAMP_TOP ? 3 : 0;
        }
      }
      majorityFilter(top);
      drawRidges(top, rng);
      dropSmallBlobs(top, 4, MIN_WATER_BLOB, 3);

      // 5) 下半 = 上半 180° 旋转（点对称）
      const grid = [];
      for (let r = 0; r < gh; r++) {
        grid[r] = [];
        for (let c = 0; c < gw; c++) {
          const er = r < half ? r : gh - 1 - r;
          const ec = r < half ? c : gw - 1 - c;
          grid[r][c] = top[er][ec];
        }
      }

      // 兜底生成时：清理建筑（工厂/研究所）周围的山地与水域，避免建筑被不可通行地形封死
      clearTerrainAroundBuildingsLocal(grid, gw, gh);

      setTerrainGrid(grid, gw, gh);
    } catch (err) {
      terrainReady = false;
      if (typeof console !== 'undefined') console.warn('[warfactory] 地形生成失败:', err);
    }
  }

  /** 元胞自动机「众数滤波」：每格取 3×3 邻域内占比最高的类型，抹掉孤立点与锯齿，使同类地形连成片 */
  function majorityFilter(grid) {
    const R = grid.length;
    if (!R) return;
    const C = grid[0].length;
    for (let it = 0; it < MAJORITY_ROUNDS; it++) {
      const nx = [];
      for (let r = 0; r < R; r++) {
        nx[r] = [];
        for (let c = 0; c < C; c++) {
          const cnt = {};
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const rr = r + dr, cc = c + dc;
              if (rr < 0 || rr >= R || cc < 0 || cc >= C) continue;
              const v = grid[rr][cc];
              cnt[v] = (cnt[v] || 0) + 1;
            }
          }
          let best = grid[r][c]; // 平票时保留原类型
          let bn = cnt[best] || 0;
          for (const k in cnt) if (cnt[k] > bn) { best = Number(k); bn = cnt[k]; }
          nx[r][c] = best;
        }
      }
      for (let r = 0; r < R; r++) grid[r] = nx[r];
    }
  }

  /** 随机游走山脊：只走正交 4 方向（保证 4-连通不断裂），线宽多为 1 格，故山体窄而连续成脉 */
  function drawRidges(grid, rng) {
    const half = grid.length;
    if (!half) return;
    const gw = grid[0].length;
    const dr4 = [-1, 0, 1, 0];
    const dc4 = [0, 1, 0, -1];
    const put = (r, c) => {
      if (r < 0 || r >= half || c < 0 || c >= gw) return;
      grid[r][c] = 2;
    };
    for (let k = 0; k < RIDGE_COUNT; k++) {
      let r = Math.floor(rng() * half);
      let c = Math.floor(rng() * gw);
      let dir = Math.floor(rng() * 4);
      const len = Math.floor(gw * (0.9 + rng() * 1.2));
      for (let s = 0; s < len; s++) {
        put(r, c);
        if (rng() < RIDGE_WIDEN) put(r + dr4[(dir + 1) % 4], c + dc4[(dir + 1) % 4]);
        if (rng() < 0.22) dir = (dir + (rng() < 0.5 ? 1 : 3)) % 4;
        let nr = r + dr4[dir], nc = c + dc4[dir];
        if (nr < 0 || nr >= half || nc < 0 || nc >= gw) {
          dir = (dir + 2) % 4;
          nr = r + dr4[dir]; nc = c + dc4[dir];
          if (nr < 0) nr = 0; else if (nr >= half) nr = half - 1;
          if (nc < 0) nc = 0; else if (nc >= gw) nc = gw - 1;
        }
        r = nr; c = nc;
      }
    }
  }

  /** 抹掉面积小于 minArea 的同类连通块（转为 fallback），保证水域都是大片连续 */
  function dropSmallBlobs(grid, type, minArea, fallback) {
    const R = grid.length;
    if (!R) return;
    const C = grid[0].length;
    const seen = new Array(R * C).fill(false);
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        if (grid[r][c] !== type || seen[r * C + c]) continue;
        const st = [[r, c]];
        seen[r * C + c] = true;
        const cells = [];
        while (st.length) {
          const cur = st.pop();
          cells.push(cur);
          const y = cur[0], x = cur[1];
          for (let k = 0; k < 4; k++) {
            const ny = y + (k === 0 ? 1 : k === 1 ? -1 : 0);
            const nx2 = x + (k === 2 ? 1 : k === 3 ? -1 : 0);
            if (ny < 0 || ny >= R || nx2 < 0 || nx2 >= C) continue;
            if (seen[ny * C + nx2] || grid[ny][nx2] !== type) continue;
            seen[ny * C + nx2] = true;
            st.push([ny, nx2]);
          }
        }
        if (cells.length < minArea) for (const cell of cells) grid[cell[0]][cell[1]] = fallback;
      }
    }
  }

  // 把地形类型网格写入离屏画布（一次性栅格化，逐帧直接贴图）
  function setTerrainGrid(grid, gw, gh) {
    terrainGrid = grid;
    terrainGW = gw;
    terrainGH = gh;
    const cv = document.createElement('canvas');
    cv.width = WORLD_W;
    cv.height = WORLD_H;
    paintTerrain(cv.getContext('2d'), grid, gw, gh, TERRAIN_CELL);
    terrainCanvas = cv;
    terrainReady = true;
  }

  /** 解析服务端下发的地形（权威），优先于本地生成使用 */
  function applyServerTerrain(terr) {
    try {
      if (!terr || !terr.data) return false;
      const cols = terr.cols || terrainGW || 60;
      const rows = terr.rows || terrainGH || 40;
      const data = terr.data;
      const grid = [];
      let ok = true;
      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
          const v = Number(data[r * cols + c]);
          grid[r][c] = Number.isInteger(v) && v >= 0 && v <= 4 ? v : 0;
          if (!Number.isInteger(v)) ok = false;
        }
      }
      setTerrainGrid(grid, cols, rows);
      return ok;
    } catch (err) {
      terrainReady = false;
      if (typeof console !== 'undefined') console.warn('[warfactory] 服务端地形解析失败:', err);
      return false;
    }
  }

  // 本地兜底时，把建筑周围的山地与水域清成平原（与服务端一致）
  function clearTerrainAroundBuildingsLocal(grid, gw, gh) {
    if (!meta || !meta.factories) return;
    const R = 3;
    const pts = [];
    for (const f of meta.factories) pts.push([f.x, f.y]);
    if (meta.labs) for (const l of meta.labs) pts.push([l.x, l.y]);
    for (const pt of pts) {
      const cc = Math.floor(pt[0] / TERRAIN_CELL);
      const cr = Math.floor(pt[1] / TERRAIN_CELL);
      for (let r = cr - R; r <= cr + R; r++) {
        for (let c = cc - R; c <= cc + R; c++) {
          if (r < 0 || r >= gh || c < 0 || c >= gw) continue;
          if (grid[r][c] === 2) grid[r][c] = 0;
        }
      }
    }
  }

  // 把地形类型网格画成水墨笔触（平原留白透出宣纸）
  function paintTerrain(g, grid, gw, gh, CELL) {
    for (let r = 0; r < gh; r++) {
      for (let c = 0; c < gw; c++) {
        const t = grid[r][c];
        if (t === 0) continue;
        const x = c * CELL, y = r * CELL;
        const cx = x + CELL / 2, cy = y + CELL / 2;
        const cr = cellRng(r, c);
        if (t === 3) {
          // 沼泽（可通行，减速）：湿墨底色 + 草簇点
          g.fillStyle = 'rgba(104,104,72,0.20)';
          g.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
          const n = 3 + Math.floor(cr() * 3);
          for (let i = 0; i < n; i++) {
            const px = x + 4 + cr() * (CELL - 8);
            const py = y + 4 + cr() * (CELL - 8);
            g.strokeStyle = 'rgba(88,96,58,' + (0.30 + cr() * 0.25) + ')';
            g.lineWidth = 1;
            g.beginPath();
            g.moveTo(px, py + 4);
            g.lineTo(px + (cr() - 0.5) * 4, py - 4);
            g.stroke();
          }
        } else if (t === 4) {
          // 水域（不可通行）：大片深墨蓝，横向波纹
          g.fillStyle = 'rgba(74,96,112,0.40)';
          g.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
          g.strokeStyle = 'rgba(50,72,92,0.45)';
          g.lineWidth = 1.4;
          for (let k = 0; k < 3; k++) {
            const yy = y + CELL * (0.25 + k * 0.25);
            g.beginPath();
            g.moveTo(x + 4, yy);
            g.quadraticCurveTo(cx, yy - 4, x + CELL - 4, yy);
            g.stroke();
          }
        } else if (t === 2) {
          // 山（不可通行，且有高度：遮挡视线与弹道 —— 画得醒目些）
          g.fillStyle = 'rgba(72,68,62,0.42)';
          g.beginPath();
          g.moveTo(cx - CELL * 0.46, cy + CELL * 0.32);
          g.lineTo(cx, cy - CELL * 0.38);
          g.lineTo(cx + CELL * 0.46, cy + CELL * 0.32);
          g.closePath();
          g.fill();
          g.strokeStyle = 'rgba(40,38,34,0.55)';
          g.lineWidth = 1.5;
          g.stroke();
          // 山脊线
          g.strokeStyle = 'rgba(40,38,34,0.30)';
          g.lineWidth = 1;
          g.beginPath();
          g.moveTo(cx - CELL * 0.16, cy + CELL * 0.08);
          g.lineTo(cx, cy - CELL * 0.38);
          g.stroke();
        }
      }
    }
  }

  /* ================= 建筑绘制 ================= */

  /** 飞檐屋顶（原点在屋脊底边中心，向上） */
  function drawRoof(c, w) {
    const h = w * 0.3;
    c.beginPath();
    c.moveTo(-w / 2, 0);
    c.quadraticCurveTo(-w * 0.4, -h * 0.6, 0, -h);
    c.quadraticCurveTo(w * 0.4, -h * 0.6, w / 2, 0);
    c.quadraticCurveTo(0, -h * 0.32, -w / 2, 0);
    c.stroke();
    c.beginPath();
    c.moveTo(-w * 0.15, -h * 0.66);
    c.lineTo(w * 0.15, -h * 0.66);
    c.stroke();
  }

  function drawFactoryBuilding(c, f, t) {
    const lvl = f.level;
    // 石台基座
    c.fillStyle = 'rgba(42,38,32,0.07)';
    c.beginPath();
    c.ellipse(0, 34, 66, 16, 0, 0, TAU);
    c.fill();

    // 围墙（双线）
    c.strokeStyle = INK;
    c.lineWidth = 3;
    c.strokeRect(-46, -14, 92, 48);
    c.lineWidth = 1;
    c.strokeStyle = hexAlpha(INK, 0.45);
    c.strokeRect(-40, -8, 80, 36);

    // 门楼
    c.strokeStyle = INK;
    c.lineWidth = 2.4;
    c.beginPath();
    c.moveTo(-13, 34);
    c.lineTo(-13, 8);
    c.quadraticCurveTo(0, -4, 13, 8);
    c.lineTo(13, 34);
    c.stroke();

    // 后方主塔：lvl 层飞檐
    c.save();
    c.translate(0, -14);
    c.strokeStyle = INK;
    for (let i = 0; i < lvl; i++) {
      c.lineWidth = 2.6 - i * 0.3;
      c.beginPath();
      c.rect(-20 + i * 2, -14, 40 - i * 4, 14);
      c.stroke();
      c.translate(0, -14);
      drawRoof(c, 58 - i * 8);
      c.translate(0, -drawRoofH(58 - i * 8));
    }
    // 塔顶旗杆 + 帅旗
    const ownerColor = f.owner >= 0 ? playerColor(f.owner) : null;
    c.strokeStyle = INK;
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(0, -26);
    c.stroke();
    if (ownerColor) {
      c.fillStyle = ownerColor;
      c.beginPath();
      c.moveTo(0, -26);
      c.lineTo(20, -21);
      c.lineTo(0, -14);
      c.closePath();
      c.fill();
      c.fillStyle = '#f6efdd';
      c.font = '700 9px ' + CALLOUT_FONT;
      c.textAlign = 'center';
      c.fillText(LEVEL_CHAR[lvl], 8, -18);
    } else {
      // 中立：灰白旗
      c.strokeStyle = hexAlpha(INK, 0.6);
      c.lineWidth = 1.4;
      c.beginPath();
      c.moveTo(0, -26);
      c.lineTo(16, -22);
      c.lineTo(0, -15);
      c.closePath();
      c.stroke();
    }
    c.restore();

    // 烟囱 + 炊烟（产兵中）
    c.strokeStyle = INK;
    c.lineWidth = 2;
    c.strokeRect(-38, -30, 10, 16);
    if (f.owner >= 0 && f.prodProg > 0.05) {
      const ph = (t / 900) % 1;
      c.fillStyle = hexAlpha(INK, 0.18 * (1 - ph));
      c.beginPath();
      c.arc(-33 + Math.sin(t / 300) * 3, -36 - ph * 16, 3 + ph * 3.5, 0, TAU);
      c.fill();
    }
  }

  function drawRoofH(w) {
    return w * 0.3;
  }

  function factoryRadius() {
    return (meta && meta.consts && meta.consts.factoryR) || 58;
  }

  function drawFactory(f, t) {
    const c = ctx;
    c.save();
    c.translate(f.x, f.y);

    // 占领圈
    const cr = (meta && meta.consts && meta.consts.captureR) || 118;
    c.strokeStyle = hexAlpha(INK, 0.18);
    c.lineWidth = 1.6;
    c.setLineDash([7, 7]);
    c.beginPath();
    c.arc(0, 0, cr, 0, TAU);
    c.stroke();
    c.setLineDash([]);

    // 占领进度弧
    if (f.capProg > 0 && f.capBy >= 0) {
      const col = playerColor(f.capBy);
      c.strokeStyle = f.contested && Math.floor(t / 150) % 2 === 0
        ? hexAlpha(col, 0.35)
        : col;
      c.lineWidth = 4.5;
      c.beginPath();
      c.arc(0, 0, cr, -Math.PI / 2, -Math.PI / 2 + (f.capProg / 100) * TAU);
      c.stroke();
    }

    // 归属底色盘：整块厂区压上归属方阵营色（红/蓝/黄/绿）60% 透明。
    // 画在建筑之前，建筑压在上面；中立厂不着色，仍是一片素纸。
    if (f.owner >= 0) {
      const ocol = playerColor(f.owner);
      c.fillStyle = hexAlpha(ocol, OWNER_PAD_ALPHA);
      c.beginPath();
      c.ellipse(0, 20, 72, 33, 0, 0, TAU);
      c.fill();
      c.strokeStyle = hexAlpha(ocol, 0.9);
      c.lineWidth = 1.8 / zoom;
      c.stroke();
    }

    drawFactoryBuilding(c, f, t);

    // 产能条
    if (f.owner >= 0) {
      const bw = 56;
      c.fillStyle = hexAlpha(INK, 0.25);
      c.fillRect(-bw / 2, 44, bw, 3.5);
      c.fillStyle = playerColor(f.owner);
      c.fillRect(-bw / 2, 44, bw * clamp(f.prodProg, 0, 1), 3.5);
    }

    // 选中高亮（选中后右键可设集结点）
    if (f.id === selFacId) {
      const pulse = 1 + Math.sin(t / 320) * 0.06;
      c.strokeStyle = hexAlpha(playerColor(f.owner), 0.9);
      c.lineWidth = 3 / zoom;
      c.setLineDash([9, 6]);
      c.lineDashOffset = -(t / 50) % 15;
      c.beginPath();
      c.arc(0, 0, (factoryRadius() + 14) * pulse, 0, TAU);
      c.stroke();
      c.setLineDash([]);
      c.lineDashOffset = 0;
    }

    // 等级印
    c.fillStyle = f.owner >= 0 ? hexAlpha(playerColor(f.owner), 0.92) : hexAlpha(INK, 0.55);
    c.beginPath();
    c.rect(-10, 52, 20, 20);
    c.fill();
    c.fillStyle = '#f6efdd';
    c.font = '700 13px ' + CALLOUT_FONT;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(LEVEL_CHAR[f.level], 0, 63);

    // 生产兵种印：本厂只产这一种，开局固定
    const cn = UNIT_CN[f.pt] || '';
    if (cn) {
      const col = f.owner >= 0 ? playerColor(f.owner) : INK;
      c.fillStyle = hexAlpha(col, 0.3);
      c.beginPath();
      c.rect(14, 52, 20, 20);
      c.fill();
      c.strokeStyle = hexAlpha(col, 0.85);
      c.lineWidth = 1.2 / zoom;
      c.stroke();
      c.fillStyle = hexAlpha(INK, 0.9);
      c.font = '700 12px ' + CALLOUT_FONT;
      c.fillText(cn.charAt(0), 24, 63);
    }

    // 工厂血条：工厂可被攻击，血打光即由「最后一击者」接管；中立厂只有 1/3 血
    if (f.hp != null && f.hpMax > 0) {
      const ratio = clamp(f.hp / f.hpMax, 0, 1);
      const hw = 76;
      const hy = 76;
      c.fillStyle = 'rgba(38,34,28,0.30)';
      c.fillRect(-hw / 2, hy, hw, 6);
      c.fillStyle =
        ratio > 0.5
          ? hexAlpha('#4d6b3c', 0.9)
          : ratio > 0.22
          ? hexAlpha('#b8862c', 0.92)
          : hexAlpha('#a63a2e', 0.95);
      c.fillRect(-hw / 2, hy, hw * ratio, 6);
      c.strokeStyle = hexAlpha(INK, 0.55);
      c.lineWidth = 1;
      c.strokeRect(-hw / 2, hy, hw, 6);
      if (ratio < 0.999) {
        c.fillStyle = hexAlpha(INK, 0.8);
        c.font = '600 11px ' + CALLOUT_FONT;
        c.textAlign = 'center';
        c.textBaseline = 'top';
        c.fillText(Math.round(f.hp) + ' / ' + Math.round(f.hpMax), 0, hy + 9);
      }
    }
    c.textBaseline = 'alphabetic';
    c.restore();
  }

  /** 工厂 → 集结点：虚线牵引 + 旗标；选中的工厂加粗高亮 */
  function drawRallies(t) {
    if (!rallyById.size) return;
    const c = ctx;
    for (const f of factoriesView) {
      const r = rallyById.get(f.id);
      if (!r) continue;
      const col = f.owner >= 0 ? playerColor(f.owner) : INK;
      const sel = f.id === selFacId;
      c.save();
      c.strokeStyle = hexAlpha(col, sel ? 0.85 : 0.45);
      c.lineWidth = (sel ? 2.6 : 1.6) / zoom;
      c.setLineDash([10, 8]);
      c.lineDashOffset = sel ? -(t / 45) % 18 : 0; // 选中时流动，指示行进方向
      c.beginPath();
      c.moveTo(f.x, f.y);
      c.lineTo(r.x, r.y);
      c.stroke();
      c.setLineDash([]);
      c.lineDashOffset = 0;

      // 集结点旗标：杆 + 三角旗 + 落点圈
      const pulse = 1 + Math.sin(t / 380) * 0.1;
      c.strokeStyle = hexAlpha(col, 0.9);
      c.lineWidth = 2 / zoom;
      c.beginPath();
      c.moveTo(r.x, r.y);
      c.lineTo(r.x, r.y - 30);
      c.stroke();
      c.fillStyle = hexAlpha(col, 0.9);
      c.beginPath();
      c.moveTo(r.x, r.y - 30);
      c.lineTo(r.x + 18, r.y - 23);
      c.lineTo(r.x, r.y - 16);
      c.closePath();
      c.fill();
      c.strokeStyle = hexAlpha(col, sel ? 0.8 : 0.5);
      c.lineWidth = (sel ? 2.2 : 1.4) / zoom;
      c.beginPath();
      c.arc(r.x, r.y, 13 * pulse, 0, TAU);
      c.stroke();
      c.beginPath();
      c.moveTo(r.x - 5, r.y);
      c.lineTo(r.x + 5, r.y);
      c.moveTo(r.x, r.y - 5);
      c.lineTo(r.x, r.y + 5);
      c.stroke();

      // 旗上标注工厂编号，便于分辨是哪个厂的集结地
      c.fillStyle = hexAlpha(INK, 0.75);
      c.font = '600 11px ' + CALLOUT_FONT;
      c.textAlign = 'left';
      c.textBaseline = 'middle';
      c.fillText('集' + f.id, r.x + 22, r.y - 23);
      c.textBaseline = 'alphabetic';
      c.restore();
    }
  }

  function drawLab(l, t) {
    const c = ctx;
    c.save();
    c.translate(l.x, l.y);
    const owned = l.owner >= 0;
    const col = owned ? playerColor(l.owner) : hexAlpha(INK, 0.7);

    // 六边形亭身
    c.strokeStyle = owned ? col : INK;
    c.lineWidth = 2.6;
    c.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (TAU / 6) * i - Math.PI / 6;
      const px = Math.cos(a) * 30;
      const py = Math.sin(a) * 30;
      i === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
    }
    c.closePath();
    c.stroke();

    // 内环 + 核心（归属后呼吸）
    const breath = owned ? 1 + Math.sin(t / 400) * 0.12 : 1;
    c.strokeStyle = hexAlpha(owned ? col : INK, 0.55);
    c.lineWidth = 1.4;
    c.beginPath();
    c.arc(0, 0, 15 * breath, 0, TAU);
    c.stroke();
    c.fillStyle = owned ? hexAlpha(col, 0.75) : hexAlpha(INK, 0.4);
    c.beginPath();
    c.arc(0, 0, 6.5, 0, TAU);
    c.fill();

    // 天线
    c.strokeStyle = INK;
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(0, -30);
    c.lineTo(0, -44);
    c.stroke();
    c.beginPath();
    c.arc(0, -47, 3, 0, TAU);
    c.stroke();

    // 归属印
    if (owned) {
      c.fillStyle = hexAlpha(col, 0.9);
      c.beginPath();
      c.rect(22, -40, 16, 16);
      c.fill();
      c.fillStyle = '#f6efdd';
      c.font = '700 11px ' + CALLOUT_FONT;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText('研', 30, -31);
      c.textBaseline = 'alphabetic';
    }

    c.fillStyle = hexAlpha(INK, 0.6);
    c.font = '12px ' + CALLOUT_FONT;
    c.textAlign = 'center';
    c.fillText('研 究 所', 0, 50);
    // 研究所血条：和工厂一样可被攻击，打光即由最后一击者接管
    drawBuildingHpBar(c, 0, 58, l.hp, l.hpMax, 64);
    c.restore();
  }

  /** 建筑通用血条（世界坐标，以 (x,y) 为左上角基准） */
  function drawBuildingHpBar(c, x, y, hp, hpMax, w) {
    if (hp == null || !(hpMax > 0)) return;
    const ratio = clamp(hp / hpMax, 0, 1);
    c.fillStyle = 'rgba(38,34,28,0.30)';
    c.fillRect(x - w / 2, y, w, 6);
    c.fillStyle =
      ratio > 0.5
        ? hexAlpha('#4d6b3c', 0.9)
        : ratio > 0.22
          ? hexAlpha('#b8862c', 0.92)
          : hexAlpha('#a63a2e', 0.95);
    c.fillRect(x - w / 2, y, w * ratio, 6);
    c.strokeStyle = hexAlpha(INK, 0.55);
    c.lineWidth = 1;
    c.strokeRect(x - w / 2, y, w, 6);
    if (ratio < 0.999) {
      c.fillStyle = hexAlpha(INK, 0.8);
      c.font = '600 11px ' + CALLOUT_FONT;
      c.textAlign = 'center';
      c.textBaseline = 'top';
      c.fillText(Math.round(hp) + ' / ' + Math.round(hpMax), x, y + 9);
      c.textBaseline = 'alphabetic';
    }
  }

  /* ================= 总部绘制 ================= */

  function drawHq(h) {
    const c = ctx;
    c.save();
    c.translate(h.x, h.y);
    const col = playerColor(h.owner);
    const down = h.down;

    // 台基 = 归属底色盘：压上归属方阵营色（红/蓝/黄/绿）60% 透明；总部陷落则退回素灰
    c.fillStyle = down ? hexAlpha(INK, 0.12) : hexAlpha(col, OWNER_PAD_ALPHA);
    c.beginPath();
    c.ellipse(0, 18, 64, 22, 0, 0, TAU);
    c.fill();
    c.strokeStyle = down ? hexAlpha(INK, 0.3) : hexAlpha(col, 0.9);
    c.lineWidth = 1.8 / zoom;
    c.stroke();

    // 双层城楼
    c.strokeStyle = down ? hexAlpha(INK, 0.35) : hexAlpha(col, 0.9);
    c.lineWidth = 2.8;
    c.beginPath();
    c.moveTo(-46, 20);
    c.lineTo(-46, -14);
    c.lineTo(46, -14);
    c.lineTo(46, 20);
    c.closePath();
    c.stroke();
    c.beginPath();
    c.moveTo(-30, -14);
    c.lineTo(-30, -40);
    c.lineTo(30, -40);
    c.lineTo(30, -14);
    c.closePath();
    c.stroke();

    // 檐（飞檐两条弧）
    c.lineWidth = 2.4;
    c.beginPath();
    c.moveTo(-58, -14);
    c.quadraticCurveTo(0, -30, 58, -14);
    c.stroke();
    c.beginPath();
    c.moveTo(-40, -40);
    c.quadraticCurveTo(0, -52, 40, -40);
    c.stroke();

    // 主旗
    c.strokeStyle = hexAlpha(col, 0.95);
    c.lineWidth = 2.4;
    c.beginPath();
    c.moveTo(0, -40);
    c.lineTo(0, -74);
    c.stroke();
    if (down) {
      c.strokeStyle = hexAlpha(INK, 0.4);
      c.beginPath();
      c.moveTo(0, -74);
      c.lineTo(14, -66);
      c.lineTo(0, -58);
      c.stroke();
    } else {
      const flap = Math.sin(Date.now() / 420) * 4;
      c.fillStyle = hexAlpha(col, 0.9);
      c.beginPath();
      c.moveTo(0, -74);
      c.lineTo(24, -68 + flap);
      c.lineTo(0, -58);
      c.closePath();
      c.fill();
    }

    // 中央印
    c.fillStyle = down ? hexAlpha(INK, 0.35) : hexAlpha(col, 0.85);
    c.beginPath();
    c.arc(0, 2, 11, 0, TAU);
    c.fill();
    c.fillStyle = '#f6efdd';
    c.font = '700 13px ' + CALLOUT_FONT;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('帅', 0, 3);
    c.textBaseline = 'alphabetic';

    // 名称 + 血条
    c.fillStyle = down ? hexAlpha(INK, 0.45) : hexAlpha(INK, 0.75);
    c.font = '12px ' + CALLOUT_FONT;
    c.textAlign = 'center';
    c.fillText(down ? '总部（陷落）' : '总 部', 0, 92);
    if (!down) drawBuildingHpBar(c, 0, 100, h.hp, h.hpMax, 84);
    c.restore();
  }

  /* ================= 单位绘制（玩家手绘模型 · 水墨化） ================= */

  function drawHexagon(c, x, y, r) {
    c.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i;
      const px = x + Math.cos(a) * r;
      const py = y + Math.sin(a) * r;
      i === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
    }
    c.closePath();
    c.stroke();
  }

  /* ---------- 阶数装饰：越高级 → 内部花纹越多 + 外部挂件越多 ---------- */

  /** 细节档位：1 阶 = 0（简陋）、2 阶 = 1（中）、3 阶 = 2（繁） */
  function detailLevel(tier) {
    return Math.max(0, Math.min(2, (tier | 0) - 1));
  }

  /** 各兵种各阶的「身体半长 / 半宽」（设计坐标 px）：内部花纹与外部挂件都按它贴附 */
  const BODY_SPAN = {
    warrior: [[13, 9], [16, 11], [19, 13]],
    shield: [[24, 21], [28, 23], [31, 26]],
    ranger: [[16, 8], [19, 9], [22, 11]],
    burst: [[14, 13], [17, 15], [21, 17]],
    burn: [[12, 8], [14, 9], [16, 10]],
    laser: [[17, 10], [20, 11], [23, 12]],
  };

  /** 各兵种内部花纹的纹样轮换表（中级取第 1 道、高级再叠第 2 道；守势分支错开一位） */
  const UNIT_PATTERNS = {
    warrior: ['crest', 'hatch', 'ring'],
    shield: ['ring', 'plate', 'crest'],
    ranger: ['hatch', 'ring', 'crest'],
    burst: ['plate', 'ring', 'hatch'],
    burn: ['crest', 'hatch', 'plate'],
    laser: ['ring', 'crest', 'hatch'],
  };

  /** 躯干内部花纹：ring 同心环 / crest 菱形徽 / hatch 甲片横纹 / plate 双道甲缝 */
  function drawInnerPattern(c, kind, cx, cy, rx, ry, col) {
    c.save();
    c.strokeStyle = hexAlpha(col, 0.55);
    c.lineWidth = 1.3;
    if (kind === 'crest') {
      c.beginPath();
      c.moveTo(cx - rx, cy);
      c.lineTo(cx, cy - ry);
      c.lineTo(cx + rx, cy);
      c.lineTo(cx, cy + ry);
      c.closePath();
      c.stroke();
    } else if (kind === 'hatch') {
      for (let i = -1; i <= 1; i++) {
        c.beginPath();
        c.moveTo(cx - rx * 0.85, cy + ry * i * 0.7);
        c.lineTo(cx + rx * 0.85, cy + ry * i * 0.34);
        c.stroke();
      }
    } else if (kind === 'plate') {
      c.beginPath();
      c.moveTo(cx - rx, cy - ry * 0.5);
      c.lineTo(cx + rx, cy - ry * 0.18);
      c.moveTo(cx - rx, cy + ry * 0.5);
      c.lineTo(cx + rx, cy + ry * 0.18);
      c.stroke();
    } else {
      c.beginPath();
      c.ellipse(cx, cy, Math.max(2, rx), Math.max(2, ry), 0, 0, TAU);
      c.stroke();
    }
    c.restore();
  }

  /** 单枚挂件（成串的穗子）：提绳 + 大坠 + 提绳 + 小坠（dir = ±1 决定朝哪一侧垂） */
  function drawPendant(c, x, y, dir, col) {
    c.save();
    c.strokeStyle = hexAlpha(INK, 0.75);
    c.lineWidth = 1.4;
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x, y + dir * 3);
    c.moveTo(x, y + dir * 6.2);
    c.lineTo(x, y + dir * 8);
    c.stroke();
    c.fillStyle = hexAlpha(col, 0.9);
    c.beginPath();
    c.arc(x, y + dir * 4.6, 2.2, 0, TAU);
    c.fill();
    c.beginPath();
    c.arc(x, y + dir * 9.4, 1.4, 0, TAU);
    c.stroke();
    c.restore();
  }

  /**
   * 通用阶数装饰（所有兵种共用，保证规则一致）：
   *   1 阶 → 不画（简陋）
   *   2 阶 → 1 道内部花纹 + 左右各 1 枚挂件
   *   3 阶 → 2 道内部花纹 + 左右各 2 枚挂件 + 一条阶层饰带
   * 必须在兵种本体绘制之后调用（叠在本体之上）。
   */
  function drawTierOrnament(c, type, tier, branch, col) {
    const lv = detailLevel(tier);
    if (lv <= 0) return;
    const spans = BODY_SPAN[type] || BODY_SPAN.warrior;
    const span = spans[Math.min(spans.length - 1, lv)];
    const spanX = span[0];
    const spanY = span[1];

    // 内部花纹：从躯干后段向中段铺开，档位越高道数越多
    const kinds = UNIT_PATTERNS[type] || UNIT_PATTERNS.warrior;
    const off = branch === 'B' ? 1 : 0;
    for (let k = 0; k < lv; k++) {
      drawInnerPattern(
        c,
        kinds[(k + off) % kinds.length],
        -spanX * (0.45 - k * 0.3),
        0,
        Math.max(3, spanX * (0.4 - k * 0.1)),
        Math.max(3, spanY * (0.5 - k * 0.12)),
        col
      );
    }

    // 外部挂件：左右各 lv 枚，沿身体长轴排开，挂点压在外缘上（穗子只探出一小截）
    for (let side = -1; side <= 1; side += 2) {
      for (let k = 0; k < lv; k++) {
        drawPendant(c, spanX * (0.12 - k * 0.55), side * spanY * 0.86, side, col);
      }
    }

    // 3 阶专属：一条贯穿躯干的阶层饰带
    if (lv >= 2) {
      c.save();
      c.strokeStyle = hexAlpha(col, 0.8);
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(-spanX * 0.9, -spanY * 0.62);
      c.lineTo(spanX * 0.95, -spanY * 0.3);
      c.moveTo(-spanX * 0.9, spanY * 0.62);
      c.lineTo(spanX * 0.95, spanY * 0.3);
      c.stroke();
      c.restore();
    }
  }

  function drawWarrior(c, tier, branch, col) {
    const line = 2.5 + tier * 0.4;
    c.strokeStyle = INK;
    c.lineWidth = line;
    const acc = TYPE_ACCENT.warrior;

    if (tier === 1) {
      c.beginPath();
      c.moveTo(-10, 0); c.lineTo(8, -8); c.lineTo(14, 0); c.lineTo(8, 8);
      c.closePath(); c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(2, 0, 3, 0, TAU); c.fill();
    }
    if (tier === 2 && branch === 'A') {
      c.beginPath();
      c.moveTo(-12, 0); c.lineTo(10, -10); c.lineTo(18, 0); c.lineTo(10, 10);
      c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-8, -10); c.lineTo(-2, -6);
      c.moveTo(-8, 10); c.lineTo(-2, 6);
      c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(2, 0, 3.5, 0, TAU); c.fill();
    }
    if (tier === 2 && branch === 'B') {
      c.beginPath();
      c.moveTo(-10, 0); c.lineTo(12, -6); c.lineTo(16, 0); c.lineTo(12, 6);
      c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-14, 0); c.lineTo(-22, -3);
      c.moveTo(-14, 0); c.lineTo(-22, 3);
      c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(2, 0, 3, 0, TAU); c.fill();
    }
    if (tier === 3 && branch === 'A') {
      c.beginPath();
      c.moveTo(-14, 0); c.lineTo(12, -12); c.lineTo(22, 0); c.lineTo(12, 12);
      c.closePath(); c.stroke();
      c.fillStyle = '#6e2420';
      c.fillRect(-4, -4, 8, 8);
      c.beginPath();
      c.moveTo(-10, -12); c.lineTo(-4, -8);
      c.moveTo(-10, 12); c.lineTo(-4, 8);
      c.stroke();
      c.beginPath();
      c.moveTo(10, 0); c.lineTo(26, 0);
      c.stroke();
    }
    if (tier === 3 && branch === 'B') {
      c.beginPath();
      c.moveTo(-10, 0); c.lineTo(14, -5); c.lineTo(18, 0); c.lineTo(14, 5);
      c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-14, -8); c.lineTo(4, -14); c.lineTo(8, -8); c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-14, 8); c.lineTo(4, 14); c.lineTo(8, 8); c.closePath(); c.stroke();
      c.beginPath(); c.arc(-14, 0, 6, 0, TAU); c.stroke();
      c.beginPath(); c.arc(-20, 0, 3, 0, TAU); c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(2, 0, 3.5, 0, TAU); c.fill();
    }

    drawTierOrnament(c, 'warrior', tier, branch, col);
  }

  function drawShield(c, tier, branch, col) {
    const line = 4 + tier * 0.4;
    c.strokeStyle = '#33465c';
    c.lineWidth = line;
    const acc = TYPE_ACCENT.shield;

    if (tier === 1) {
      drawHexagon(c, 0, 0, 16);
      drawHexagon(c, 0, 0, 24);
      c.fillStyle = acc;
      c.beginPath(); c.arc(6, 0, 4, 0, TAU); c.fill();
      c.strokeStyle = INK;
      c.lineWidth = 2;
      c.beginPath(); c.moveTo(8, 0); c.lineTo(20, 0); c.stroke();
    }
    if (tier === 2 && branch === 'A') {
      drawHexagon(c, 0, 0, 20);
      drawHexagon(c, 0, 0, 28);
      c.strokeStyle = INK;
      c.lineWidth = 3;
      c.beginPath(); c.moveTo(10, 0); c.lineTo(24, 0); c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(6, 0, 4.5, 0, TAU); c.fill();
    }
    if (tier === 2 && branch === 'B') {
      drawHexagon(c, 0, 0, 14);
      drawHexagon(c, 0, 0, 22);
      c.strokeStyle = INK;
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(8, -3); c.lineTo(22, -3);
      c.moveTo(8, 3); c.lineTo(22, 3);
      c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(6, 0, 4, 0, TAU); c.fill();
    }
    if (tier === 3 && branch === 'A') {
      c.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI / 4) * i;
        const px = Math.cos(a) * 22;
        const py = Math.sin(a) * 22;
        i === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
      }
      c.closePath(); c.stroke();
      drawHexagon(c, 0, 0, 30);
      c.strokeStyle = INK;
      c.lineWidth = 4;
      c.beginPath(); c.moveTo(12, 0); c.lineTo(28, 0); c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(6, 0, 5, 0, TAU); c.fill();
    }
    if (tier === 3 && branch === 'B') {
      drawHexagon(c, 0, 0, 16);
      drawHexagon(c, 0, 0, 24);
      c.fillStyle = '#2f4d6b';
      c.beginPath();
      c.moveTo(4, -4); c.lineTo(8, 0); c.lineTo(4, 4); c.lineTo(0, 0);
      c.closePath(); c.fill();
      c.strokeStyle = INK;
      c.lineWidth = 2;
      c.beginPath(); c.moveTo(8, 0); c.lineTo(28, 0); c.stroke();
      c.beginPath(); c.arc(6, 0, 7, 0, TAU); c.stroke();
      c.beginPath();
      c.moveTo(8, -5); c.lineTo(24, -5);
      c.moveTo(8, 5); c.lineTo(24, 5);
      c.stroke();
    }

    drawTierOrnament(c, 'shield', tier, branch, col);
  }

  function drawRanger(c, tier, branch, col) {
    const line = 2 + tier * 0.4;
    c.strokeStyle = INK;
    c.lineWidth = line;

    if (tier === 1) {
      c.beginPath();
      c.moveTo(-12, 0); c.lineTo(6, -7); c.lineTo(22, 0); c.lineTo(6, 7);
      c.closePath(); c.stroke();
      c.lineWidth = 3;
      c.beginPath(); c.moveTo(6, 0); c.lineTo(24, 0); c.stroke();
    }
    if (tier === 2 && branch === 'A') {
      c.beginPath();
      c.moveTo(-14, 0); c.lineTo(4, -8); c.lineTo(24, 0); c.lineTo(4, 8);
      c.closePath(); c.stroke();
      c.lineWidth = 4;
      c.beginPath(); c.moveTo(8, 0); c.lineTo(28, 0); c.stroke();
      c.fillStyle = '#4a453c';
      c.beginPath(); c.arc(4, 0, 4, 0, TAU); c.fill();
    }
    if (tier === 2 && branch === 'B') {
      c.beginPath();
      c.moveTo(-12, 0); c.lineTo(6, -6); c.lineTo(20, 0); c.lineTo(6, 6);
      c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-4, -6); c.lineTo(2, -10);
      c.moveTo(-4, 6); c.lineTo(2, 10);
      c.stroke();
      c.lineWidth = 3;
      c.beginPath(); c.moveTo(6, 0); c.lineTo(24, 0); c.stroke();
    }
    if (tier === 3 && branch === 'A') {
      c.beginPath();
      c.moveTo(-16, 0); c.lineTo(2, -10); c.lineTo(26, 0); c.lineTo(2, 10);
      c.closePath(); c.stroke();
      c.lineWidth = 5;
      c.beginPath(); c.moveTo(10, 0); c.lineTo(34, 0); c.stroke();
      c.beginPath(); c.arc(4, 0, 6, 0, TAU); c.stroke();
      c.beginPath();
      c.moveTo(22, -4); c.lineTo(30, -6); c.lineTo(30, 6); c.lineTo(22, 4);
      c.closePath(); c.stroke();
    }
    if (tier === 3 && branch === 'B') {
      c.beginPath();
      c.moveTo(-14, 0); c.lineTo(4, -7); c.lineTo(20, 0); c.lineTo(4, 7);
      c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-8, -8); c.lineTo(0, -12); c.lineTo(4, -7); c.stroke();
      c.beginPath();
      c.moveTo(-8, 8); c.lineTo(0, 12); c.lineTo(4, 7); c.stroke();
      c.lineWidth = 2;
      c.beginPath(); c.moveTo(8, 0); c.lineTo(32, 0); c.stroke();
      c.fillStyle = INK;
      c.beginPath();
      c.moveTo(4, -3); c.lineTo(8, 0); c.lineTo(4, 3);
      c.closePath(); c.fill();
    }

    drawTierOrnament(c, 'ranger', tier, branch, col);
  }

  function drawBurst(c, tier, branch, col) {
    const line = 3 + tier * 0.4;
    c.strokeStyle = '#4a2c22';
    c.lineWidth = line;
    const acc = TYPE_ACCENT.burst;

    if (tier === 1) {
      c.beginPath(); c.arc(0, 0, 12, 0, TAU); c.stroke();
      c.beginPath();
      c.moveTo(8, -4); c.lineTo(22, -4);
      c.moveTo(8, 4); c.lineTo(22, 4);
      c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(0, 0, 4, 0, TAU); c.fill();
    }
    if (tier === 2 && branch === 'A') {
      c.beginPath(); c.arc(0, 0, 14, 0, TAU); c.stroke();
      c.beginPath();
      c.moveTo(10, -5); c.lineTo(26, -5);
      c.moveTo(10, 5); c.lineTo(26, 5);
      c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(0, 0, 4.5, 0, TAU); c.fill();
    }
    if (tier === 2 && branch === 'B') {
      c.beginPath(); c.arc(0, 0, 12, 0, TAU); c.stroke();
      c.beginPath();
      c.moveTo(8, -4); c.lineTo(24, -4);
      c.moveTo(8, 0); c.lineTo(24, 0);
      c.moveTo(8, 4); c.lineTo(24, 4);
      c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(0, 0, 4, 0, TAU); c.fill();
    }
    if (tier === 3 && branch === 'A') {
      c.beginPath(); c.arc(0, 0, 16, 0, TAU); c.stroke();
      c.beginPath(); c.arc(0, 0, 22, 0, TAU); c.stroke();
      c.beginPath(); c.moveTo(12, 0); c.lineTo(30, 0); c.stroke();
      c.fillStyle = acc;
      c.beginPath(); c.arc(0, 0, 5, 0, TAU); c.fill();
      c.beginPath();
      c.moveTo(10, 0); c.lineTo(22, -4);
      c.moveTo(10, 0); c.lineTo(22, 4);
      c.stroke();
    }
    if (tier === 3 && branch === 'B') {
      c.beginPath(); c.arc(0, 0, 14, 0, TAU); c.stroke();
      c.beginPath();
      c.moveTo(8, -5); c.lineTo(24, -5);
      c.moveTo(8, -1); c.lineTo(24, -1);
      c.moveTo(8, 1); c.lineTo(24, 1);
      c.moveTo(8, 5); c.lineTo(24, 5);
      c.stroke();
      c.beginPath(); c.moveTo(10, 0); c.lineTo(28, 0); c.stroke();
      c.fillStyle = INK;
      c.beginPath();
      c.moveTo(4, -3); c.lineTo(10, 0); c.lineTo(4, 3);
      c.closePath(); c.fill();
      c.fillStyle = acc;
      c.beginPath(); c.arc(0, 0, 4, 0, TAU); c.fill();
    }

    drawTierOrnament(c, 'burst', tier, branch, col);
  }

  function drawBurn(c, tier, branch, col) {
    const line = 3 + tier * 0.4;
    c.strokeStyle = '#452a22';
    c.lineWidth = line;

    if (tier === 1) {
      c.beginPath();
      c.moveTo(-10, -6); c.lineTo(-4, 0); c.lineTo(-10, 6);
      c.closePath(); c.stroke();
      c.fillStyle = TYPE_ACCENT.burn;
      c.beginPath();
      c.moveTo(-4, -3); c.lineTo(14, 0); c.lineTo(-4, 3);
      c.closePath(); c.fill();
    }
    if (tier === 2 && branch === 'A') {
      c.beginPath();
      c.moveTo(-12, -8); c.lineTo(-4, 0); c.lineTo(-12, 8);
      c.closePath(); c.stroke();
      c.fillStyle = TYPE_ACCENT.burn;
      c.beginPath();
      c.moveTo(-4, -4); c.lineTo(18, 0); c.lineTo(-4, 4);
      c.closePath(); c.fill();
      c.fillStyle = '#c07a2c';
      c.beginPath(); c.arc(-2, 0, 3, 0, TAU); c.fill();
    }
    if (tier === 2 && branch === 'B') {
      c.beginPath();
      c.moveTo(-10, -6); c.lineTo(-4, 0); c.lineTo(-10, 6);
      c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-4, -2); c.lineTo(16, -2);
      c.moveTo(-4, 2); c.lineTo(16, 2);
      c.stroke();
      c.beginPath(); c.arc(18, 0, 3, 0, TAU); c.stroke();
      c.fillStyle = '#6b6f2a';
      c.beginPath(); c.arc(-2, 0, 3, 0, TAU); c.fill();
    }
    if (tier === 3 && branch === 'A') {
      c.beginPath();
      c.moveTo(-12, -8); c.lineTo(-4, 0); c.lineTo(-12, 8);
      c.closePath(); c.stroke();
      c.fillStyle = TYPE_ACCENT.burn;
      c.beginPath();
      c.moveTo(-4, -4); c.lineTo(20, 0); c.lineTo(-4, 4);
      c.closePath(); c.fill();
      c.fillStyle = '#c07a2c';
      c.beginPath();
      c.moveTo(-4, -3); c.lineTo(14, 0); c.lineTo(-4, 3);
      c.closePath(); c.fill();
      c.beginPath(); c.arc(-2, 0, 7, 0, TAU); c.stroke();
      c.save();
      c.translate(8, 0);
      c.rotate(Math.PI / 6);
      c.fillStyle = TYPE_ACCENT.burn;
      c.beginPath();
      c.moveTo(-4, -3); c.lineTo(14, 0); c.lineTo(-4, 3);
      c.closePath(); c.fill();
      c.restore();
    }
    if (tier === 3 && branch === 'B') {
      c.beginPath();
      c.moveTo(-12, -8); c.lineTo(-4, 0); c.lineTo(-12, 8);
      c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-4, -3); c.lineTo(18, -3);
      c.moveTo(-4, 3); c.lineTo(18, 3);
      c.stroke();
      c.fillStyle = '#6b6f2a';
      c.beginPath(); c.arc(-2, 0, 4, 0, TAU); c.fill();
      c.beginPath();
      c.arc(20, -4, 2, 0, TAU);
      c.arc(22, 4, 2, 0, TAU);
      c.stroke();
      c.beginPath();
      c.moveTo(-4, -2); c.lineTo(20, -2);
      c.moveTo(-4, 2); c.lineTo(20, 2);
      c.stroke();
      c.beginPath(); c.arc(22, 0, 4, 0, TAU); c.stroke();
      c.beginPath(); c.arc(26, 0, 2, 0, TAU); c.stroke();
    }

    drawTierOrnament(c, 'burn', tier, branch, col);
  }

  /** 激光兵：长镜筒 + 聚光镜组（青色为光学部件）。阶数越高镜筒越长、镜环越多。 */
  function drawLaser(c, tier, branch, col) {
    const acc = TYPE_ACCENT.laser;
    const line = 2 + tier * 0.4;
    c.strokeStyle = INK;
    c.lineWidth = line;

    // 机座（守势分支更厚重）
    const bulk = branch === 'B' ? 8 : 6;
    c.beginPath();
    c.moveTo(-11, -bulk);
    c.lineTo(1, -bulk * 0.55);
    c.lineTo(1, bulk * 0.55);
    c.lineTo(-11, bulk);
    c.closePath();
    c.stroke();

    // 镜筒：越高级越长
    const barrel = 16 + (tier - 1) * 6;
    c.lineWidth = line + (branch === 'B' ? 2 : 1);
    c.beginPath();
    c.moveTo(1, 0);
    c.lineTo(barrel, 0);
    c.stroke();

    // 镜环：数量 = 阶数
    for (let k = 1; k < tier; k++) {
      c.lineWidth = line;
      c.beginPath();
      c.arc(1 + (barrel - 1) * (k / tier), 0, 2.4, 0, TAU);
      c.stroke();
    }
    // 聚光镜
    c.fillStyle = acc;
    c.beginPath();
    c.arc(barrel, 0, 2.6 + tier * 0.5, 0, TAU);
    c.fill();

    // 高阶：攻势加副管，守势加散热鳍
    if (tier >= 3 && branch === 'A') {
      c.lineWidth = line;
      c.beginPath();
      c.moveTo(1, -5);
      c.lineTo(barrel - 4, -5);
      c.stroke();
      c.fillStyle = acc;
      c.beginPath();
      c.arc(barrel - 4, -5, 2.4, 0, TAU);
      c.fill();
    }
    if (tier >= 2 && branch === 'B') {
      c.lineWidth = line * 0.8;
      for (let k = 0; k < 3; k++) {
        const x = 4 + k * 5;
        c.beginPath();
        c.moveTo(x, -bulk * 0.5);
        c.lineTo(x, -bulk * 0.5 - 6);
        c.stroke();
      }
    }

    drawTierOrnament(c, 'laser', tier, branch, col);
  }

  /** 把某个兵种的本体画进给定上下文的当前变换里（c 传参而非直接用 ctx，便于静态预览复用） */
  function drawUnitBody(c, type, tier, branch, col) {
    if (type === 'warrior') drawWarrior(c, tier, branch, col);
    else if (type === 'shield') drawShield(c, tier, branch, col);
    else if (type === 'ranger') drawRanger(c, tier, branch, col);
    else if (type === 'burst') drawBurst(c, tier, branch, col);
    else if (type === 'burn') drawBurn(c, tier, branch, col);
    else if (type === 'laser') drawLaser(c, tier, branch, col);
  }

  /* ================= 场景绘制 ================= */

  function playerColor(idx) {
    const p = meta && meta.players && meta.players[idx];
    return (p && p.color) || INK;
  }

  function drawUnits(t) {
    const c = ctx;
    const myIdx = myPlayerIndex();
    const S = UNIT_VIS_SCALE;
    for (const u of units.values()) {
      const col = playerColor(u.oi);
      // 该单位的实际视觉倍率 = 全局缩放 × 兵种基础体型系数（锐士靠后者补足体量）。
      // 归属墨圈 / 选中圈 / 血条 / 本体都按它绘制，避免放大后的锐士「脚踩小圈」。
      const f = S * bodyScaleOf(u.type);
      const sel = selection.has(u.id);
      const padY = u.y + 11 * f; // 脚下底色盘的圆心

      // 归属底色盘：脚下椭圆压满该方阵营色（红/蓝/黄/绿）60% 透明，同屏一眼看出是谁的兵
      c.fillStyle = hexAlpha(col, OWNER_PAD_ALPHA);
      c.beginPath();
      c.ellipse(u.x, padY, 18 * f, 6.8 * f, 0, 0, TAU);
      c.fill();
      c.strokeStyle = hexAlpha(col, 0.9);
      c.lineWidth = 1.3 / zoom;
      c.stroke();

      // 选中效果（画在本体之前 = 压在单位「下方」）：亮色光环呼吸 + 四角方框取景
      if (sel) {
        const pulse = 1 + Math.sin(t / 240) * 0.07;
        c.fillStyle = hexAlpha(col, 0.22);
        c.beginPath();
        c.ellipse(u.x, padY, 24 * f * pulse, 9.2 * f * pulse, 0, 0, TAU);
        c.fill();
        c.strokeStyle = hexAlpha(col, 1);
        c.lineWidth = 2.8 / zoom;
        c.stroke();
        // 冷色地形/深色山体上也看得清：外圈再收一道纸色细线
        c.strokeStyle = hexAlpha(PAD_EDGE, 0.75);
        c.lineWidth = 1.1 / zoom;
        c.beginPath();
        c.ellipse(u.x, padY, 24 * f * pulse + 2.4 / zoom, 9.2 * f * pulse + 2.4 / zoom, 0, 0, TAU);
        c.stroke();

        // 四角取景方框（无字）：与侦察「查」括号同族，选中时更实更亮
        const g = 21 * f;
        const arm = 7.5 * f;
        c.strokeStyle = hexAlpha(col, 1);
        c.lineWidth = 2.2 / zoom;
        c.beginPath();
        for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
          c.moveTo(u.x + sx * g, u.y + sy * g - sy * arm);
          c.lineTo(u.x + sx * g, u.y + sy * g);
          c.lineTo(u.x + sx * g - sx * arm, u.y + sy * g);
        }
        c.stroke();
      }

      // 开火后坐：刚开火的单位整体向后一顿（130ms 内衰减回位，脚底盘不动）。
      // 「有开火的感觉」一半来自枪口焰，另一半就来自这一顿。
      const rcAge = u.fireAt ? (t - u.fireAt) / 130 : 1;
      const rc = rcAge < 1 ? (1 - rcAge) * (1 - rcAge) * 4.6 * f : 0;
      const recoilX = u.x - Math.cos(u.fireAng || 0) * rc;
      const recoilY = u.y - Math.sin(u.fireAng || 0) * rc;

      // 本体（单位绘制函数内部用的是设计尺寸，这里按 f 放大）
      c.save();
      c.translate(recoilX, recoilY);
      c.rotate(u.ang);
      c.scale(f, f);
      drawUnitBody(c, u.type, u.tier, u.branch, col);
      c.restore();

      // 灼烧火苗
      if (u.burning) {
        const fl = Math.sin(t / 70 + u.id) * 2;
        c.fillStyle = hexAlpha('#c0492c', 0.75);
        c.beginPath();
        c.moveTo(u.x - 3 * f, u.y - 18 * f);
        c.quadraticCurveTo(u.x - 2 * f + fl, u.y - 27 * f, u.x, u.y - 30 * f - fl);
        c.quadraticCurveTo(u.x + 2 * f + fl, u.y - 25 * f, u.x + 3 * f, u.y - 18 * f);
        c.closePath();
        c.fill();
      }

      // 血条：所有单位默认常显（满血也显示，便于随时比对血量与兵种耐久）
      const st = unitStatsOf(u.type, u.tier, u.branch);
      const maxHp = Math.max(st.hp, u.hp);
      const bw = 26 * f;
      const by = u.y - 28 * f;
      c.fillStyle = 'rgba(38,34,28,0.42)';
      c.fillRect(u.x - bw / 2, by, bw, 3.4);
      c.fillStyle = col;
      c.fillRect(u.x - bw / 2, by, bw * clamp(u.hp / maxHp, 0, 1), 3.4);
      c.strokeStyle = hexAlpha(INK, 0.65);
      c.lineWidth = 0.8 / zoom;
      c.strokeRect(u.x - bw / 2, by, bw, 3.4);
      // 仍可进阶的标记（进化改由科技点驱动，单位本身不再有经验）
      if (u.tier < u.maxTier) {
        c.strokeStyle = hexAlpha(INK, 0.35);
        c.lineWidth = 1 / zoom;
        c.strokeRect(u.x - bw / 2, by + 4.4, bw, 2);
      }

      // 激光兵：锁定倍率读数（超过 1 倍才显示，颜色随倍率升温）
      if (u.type === 'laser' && u.lk && !u.lw && (u.lm || 100) > 105) {
        const mul = (u.lm || 100) / 100;
        const heat = clamp((mul - 1) / 4, 0, 1);
        c.save();
        c.fillStyle = heat > 0.7 ? hexAlpha('#c0492c', 0.95) : hexAlpha(INK, 0.7);
        c.font = '700 11px ' + CALLOUT_FONT;
        c.textAlign = 'center';
        c.fillText('×' + mul.toFixed(1), u.x, u.y - 30 * f);
        c.restore();
      }
      void myIdx;
    }
  }

  /** 解析激光兵锁定目标的世界坐标：服务端只下发「类别 + id」，坐标从本地视图取 */
  function lockTargetPos(u) {
    if (u.lk === 1) {
      const t = units.get(u.li);
      return t ? { x: t.x, y: t.y } : null;
    }
    if (u.lk === 2) {
      const f = factoriesView.find((x) => x.id === u.li);
      return f ? { x: f.x, y: f.y } : null;
    }
    if (u.lk === 3) {
      const l = labsView.find((x) => x.id === u.li);
      return l ? { x: l.x, y: l.y } : null;
    }
    if (u.lk === 4) {
      const h = hqView.find((x) => x.id === u.li);
      return h ? { x: h.x, y: h.y } : null;
    }
    return null;
  }

  /**
   * 解析「目标类别编号 + id」对应的世界坐标与半径（坐标全部从本地视图取）。
   * 激光/燎原的锁定指示和「追击攻击命令」的常驻指示共用这一套解析。
   */
  function targetInfoOf(kind, id) {
    if (kind === 1) {
      const t = units.get(id);
      return t ? { x: t.x, y: t.y, r: 22 } : null;
    }
    if (kind === 2) {
      const f = factoriesView.find((x) => x.id === id);
      return f ? { x: f.x, y: f.y, r: factoryRadius() } : null;
    }
    if (kind === 3) {
      const l = labsView.find((x) => x.id === id);
      return l ? { x: l.x, y: l.y, r: labR() } : null;
    }
    if (kind === 4) {
      const h = hqView.find((x) => x.id === id);
      return h ? { x: h.x, y: h.y, r: hqR() } : null;
    }
    return null;
  }

  /**
   * 激光兵光束：完全由服务端的「锁定状态」驱动。
   *  - 前摇中（lw > 0）：虚线瞄准 + 枪口蓄能光点 + 目标处收拢的锁定环（尚不造成伤害）
   *  - 已锁定（lw = 0）：枪口到目标的持续光束，粗细与亮度随倍率（1 → 5 倍）增强
   */
  function drawBeams(t) {
    const c = ctx;
    if (!meta) return;
    const maxMul = (meta.consts && meta.consts.laserMaxMul) || 5;
    const windupMs = (meta.consts && meta.consts.laserWindupMs) || 800;
    for (const u of units.values()) {
      if (u.type !== 'laser' || !u.lk) continue;
      const tp = lockTargetPos(u);
      if (!tp) continue;
      const col = playerColor(u.oi);
      const mul = Math.max(1, (u.lm || 100) / 100);
      const heat = clamp((mul - 1) / Math.max(0.001, maxMul - 1), 0, 1); // 1 倍 → 0，5 倍 → 1
      const S = UNIT_VIS_SCALE;
      const mx = u.x + Math.cos(u.ang) * 15 * S;
      const my = u.y + Math.sin(u.ang) * 15 * S;

      if (u.lw > 0) {
        // —— 前摇：蓄能中
        const prog = 1 - clamp(u.lw / windupMs, 0, 1);
        c.save();
        c.strokeStyle = hexAlpha(col, 0.3 + 0.35 * prog);
        c.lineWidth = 1.3;
        c.setLineDash([4, 6]);
        c.beginPath();
        c.moveTo(mx, my);
        c.lineTo(tp.x, tp.y);
        c.stroke();
        c.setLineDash([]);
        // 枪口蓄能光点
        c.fillStyle = hexAlpha('#eaf7ff', 0.45 + 0.5 * prog);
        c.beginPath();
        c.arc(mx, my, (2 + 4.5 * prog) * S, 0, TAU);
        c.fill();
        // 目标处收拢的锁定环
        c.strokeStyle = hexAlpha(TYPE_ACCENT.laser, 0.35 + 0.4 * prog);
        c.lineWidth = 1.6;
        c.beginPath();
        c.arc(tp.x, tp.y, (19 - 9 * prog) * S, 0, TAU);
        c.stroke();
        c.restore();
        continue;
      }

      // —— 已锁定：持续光束（外层光晕 + 内层亮芯）
      const flick = 0.88 + 0.12 * Math.sin(t / 40 + u.id);
      const w = (2.2 + heat * 4.4) * flick;
      c.save();
      c.lineCap = 'round';
      c.strokeStyle = hexAlpha(TYPE_ACCENT.laser, 0.22 + heat * 0.34);
      c.lineWidth = w * 2.6;
      c.beginPath();
      c.moveTo(mx, my);
      c.lineTo(tp.x, tp.y);
      c.stroke();
      c.strokeStyle = hexAlpha('#f4fbff', 0.55 + heat * 0.4);
      c.lineWidth = w;
      c.beginPath();
      c.moveTo(mx, my);
      c.lineTo(tp.x, tp.y);
      c.stroke();
      // 命中点的灼烧光斑
      c.fillStyle = hexAlpha(TYPE_ACCENT.laser, 0.3 + heat * 0.25);
      c.beginPath();
      c.arc(tp.x, tp.y, 9 + heat * 11, 0, TAU);
      c.fill();
      c.fillStyle = hexAlpha('#f4fbff', 0.5 + heat * 0.45);
      c.beginPath();
      c.arc(tp.x, tp.y, 2.6 + heat * 5, 0, TAU);
      c.fill();
      c.restore();
    }
  }

  /* ---------------- 水墨特效基元：一切落笔都带毛边，不许是完美圆形 ---------------- */

  /**
   * 稳定伪随机：同一 (seed, i) 永远得到同一个 0..1。
   * 弹痕 / 炸开形状每帧都要重算，若用 Math.random() 会逐帧跳成「闪砂」；
   * 快照里的弹体自带一个稳定种子，正好做到「每发子弹各不相同、但每发每帧一致」。
   */
  function fxRnd(seed, i) {
    const v = Math.sin((seed + 1) * 127.1 + (i + 1) * 311.7) * 43758.5453;
    return v - Math.floor(v);
  }

  /**
   * 一团「不规则墨」的闭合路径（只建路径，fill / stroke 由调用方定）。
   * 沿圆周取 lobes 个采样点、半径逐个抖动，再以「相邻采样点的中点」为端点、
   * 采样点为控制点连成 quadratic 曲线 —— 得到的是外凸带缺口的墨团，不是圆。
   * 所有「炸开」效果都建立在它之上。
   */
  function inkBlobPath(c, cx, cy, r, seed, opts) {
    const o = opts || {};
    const n = o.lobes || 9;
    const jit = o.jitter == null ? 0.42 : o.jitter;
    const sx = o.sx == null ? 1 : o.sx;
    const sy = o.sy == null ? 1 : o.sy;
    const ca = Math.cos(o.rot || 0);
    const sa = Math.sin(o.rot || 0);
    const px = [];
    const py = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const rr = r * (1 - jit * 0.5 + fxRnd(seed, i) * jit);
      const ux = Math.cos(a) * rr * sx;
      const uy = Math.sin(a) * rr * sy;
      px.push(cx + ux * ca - uy * sa);
      py.push(cy + ux * sa + uy * ca);
    }
    c.beginPath();
    c.moveTo((px[n - 1] + px[0]) / 2, (py[n - 1] + py[0]) / 2);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      c.quadraticCurveTo(px[i], py[i], (px[i] + px[j]) / 2, (py[i] + py[j]) / 2);
    }
    c.closePath();
  }

  /** 拖笔：沿 (dx,dy) 的反方向甩出 len 长、逐段收细变淡的笔锋（弹丸尾迹） */
  function inkTrail(c, x, y, dx, dy, len, w, alpha, col) {
    c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const f0 = i / 3;
      const f1 = (i + 1) / 3;
      c.strokeStyle = hexAlpha(col, alpha * (1 - f0));
      c.lineWidth = w * (1 - f0 * 0.72);
      c.beginPath();
      c.moveTo(x - dx * len * f0, y - dy * len * f0);
      c.lineTo(x - dx * len * f1, y - dy * len * f1);
      c.stroke();
    }
  }

  /**
   * 弹道绘制：整段没有一个「规规矩矩的圆」。
   * - 朝向取快照第 5/6 位（单位向量），形状抖动取第 7 位的个体种子；
   * - 弹丸 = 沿弹道拖笔的墨滴（墨团头 + 三级收细尾锋）；
   * - 炮击弹 = 更粗的墨块 + 长拖尾，虚线影只提示「这是抛射物」；
   * - 燃烧弹 = 朱砂火星 + 飘忽火尾；近战 = 一道沿真实攻击方向的短挥痕。
   */
  function drawBullets() {
    const c = ctx;
    if (!lastSnap || !lastSnap.b) return;
    for (const b of lastSnap.b) {
      const z = b[7] || 0;
      const arc = b[8] || 0;
      // 抛射弹（轰击）：抬高本体 + 地面阴影 + 落点虚线圈，呈现越山抛物线观感
      if (arc && z > 0.5) {
        drawArcShell(c, b[0], b[1], z, playerColor(b[2]), b[4] || 1, b[5] || 0, (b[6] || 0) * 97 + 3);
      } else {
        drawBulletBody(c, b[0], b[1], playerColor(b[2]), b[3], b[4] || 1, b[5] || 0, (b[6] || 0) * 97 + 3);
      }
    }
  }

  /**
   * 抛射弹（轰击 burst）的画法：弹体被「抬」到离地 z 像素的高度，
   * 地面上画一团圆而淡的阴影（越高越大越淡）提示落点，再套一圈虚线把「将落在此处」标出来。
   * 这样即便它正飞越一道山脉，玩家也能一眼看出这是一发曲射炮、会落在哪。
   */
  function drawArcShell(c, x, y, z, col, dx, dy, seed) {
    const rot = Math.atan2(dy, dx);
    // ① 地面阴影：越高越大、越淡
    const lift = clamp(z / 150, 0, 1);
    c.fillStyle = hexAlpha(INK, 0.16 + 0.14 * (1 - lift));
    c.beginPath();
    c.ellipse(x, y, 5 + lift * 5, 3 + lift * 2.5, 0, 0, TAU);
    c.fill();
    // ② 落点虚线圈：提示这是抛射物、会落在这里（而非当前飞行位置）
    c.strokeStyle = hexAlpha(col, 0.4);
    c.lineWidth = 1.2;
    c.setLineDash([3, 4]);
    c.beginPath();
    c.arc(x, y, 8.5, 0, TAU);
    c.stroke();
    c.setLineDash([]);
    // ③ 抬升的弹体 + 抛射拖尾（拖尾略向上飘，强化「飞在天上」的感觉）
    inkTrail(c, x, y - z, dx, dy, 24, 4, 0.4, INK);
    inkBlobPath(c, x, y - z, 5.2, seed, { lobes: 8, jitter: 0.55, sx: 1.5, rot });
    c.fillStyle = hexAlpha(INK, 0.9);
    c.fill();
    c.strokeStyle = hexAlpha(col, 0.4);
    c.lineWidth = 1.2;
    c.beginPath();
    c.arc(x, y - z, 8, 0, TAU);
    c.stroke();
  }

  /** 单发弹丸的画法（抽出来是为了 docs 下的特效图谱页能一格一格核对形状） */
  function drawBulletBody(c, x, y, col, kind, dx, dy, seed) {
    const rot = Math.atan2(dy, dx);
    if (kind === 2) {
      // 炮击弹：一大团墨 + 拖尾
      inkTrail(c, x, y, dx, dy, 30, 4.6, 0.42, INK);
      inkBlobPath(c, x, y, 5.4, seed, { lobes: 8, jitter: 0.55, sx: 1.5, rot });
      c.fillStyle = hexAlpha(INK, 0.88);
      c.fill();
      c.strokeStyle = hexAlpha(col, 0.38);
      c.lineWidth = 1.3;
      c.setLineDash([3, 4]);
      c.beginPath(); c.arc(x, y, 9.5, 0, TAU); c.stroke();
      c.setLineDash([]);
    } else if (kind === 3) {
      // 燃烧弹：朱砂火星，火尾随个体种子飘
      inkTrail(c, x, y, dx, dy, 16, 3.4, 0.5, '#c0492c');
      inkBlobPath(c, x, y, 3.4, seed, { lobes: 7, jitter: 0.62, sx: 1.35, rot });
      c.fillStyle = hexAlpha('#c0492c', 0.9);
      c.fill();
      inkBlobPath(c, x - dx * 2.4, y - dy * 2.4 - 2.6, 2.1, seed + 7, { lobes: 6, jitter: 0.7, sy: 1.25 });
      c.fillStyle = hexAlpha('#e0a03c', 0.5);
      c.fill();
    } else if (kind === 1) {
      // 近战挥击：一道带弧度的短墨痕（沿真实攻击方向，此前是写死的水平线）
      c.strokeStyle = hexAlpha(INK, 0.8);
      c.lineWidth = 2.4;
      c.lineCap = 'round';
      const na = rot + Math.PI / 2;
      c.beginPath();
      c.moveTo(x - dx * 6, y - dy * 6);
      c.quadraticCurveTo(x + Math.cos(na) * 3.2, y + Math.sin(na) * 3.2, x + dx * 6, y + dy * 6);
      c.stroke();
    } else {
      // 普通弹丸：归属色墨晕（底）→ 沿弹道拉长的墨滴（上）→ 身后拖笔
      c.fillStyle = hexAlpha(col, 0.32);
      inkBlobPath(c, x, y, 4.6, seed + 4, { lobes: 6, jitter: 0.66, sx: 1.4, rot });
      c.fill();
      inkBlobPath(c, x, y, 2.8, seed, { lobes: 7, jitter: 0.6, sx: 1.75, rot });
      c.fillStyle = hexAlpha(INK, 0.86);
      c.fill();
      inkTrail(c, x, y, dx, dy, 21, 3, 0.36, INK);
    }
  }

  /** 炮击落点：一团不规则的墨花炸开（上一版是正圆），外加甩出去的泥点 */
  function drawBoomFx(c, e, age) {
    const fade = 1 - age;
    const grow = 1 - Math.pow(1 - age, 2.4);
    c.fillStyle = hexAlpha(INK, 0.5 * fade);
    inkBlobPath(c, e.x, e.y, e.r * (0.35 + grow * 0.8), e.seed, { lobes: 11, jitter: 0.5, sy: 0.82 });
    c.fill();
    c.strokeStyle = hexAlpha(INK, 0.55 * fade);
    c.lineWidth = 2;
    inkBlobPath(c, e.x, e.y, e.r * (0.72 + grow * 0.7), e.seed + 9, { lobes: 13, jitter: 0.62, sy: 0.82 });
    c.stroke();
    for (let i = 0; i < 8; i++) {
      const a = fxRnd(e.seed, i + 3) * TAU;
      const d = e.r * (0.5 + grow) * (0.6 + fxRnd(e.seed, i + 31) * 0.8);
      c.fillStyle = hexAlpha(INK, 0.4 * fade);
      c.beginPath();
      c.arc(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d * 0.8, 1 + fxRnd(e.seed, i + 51) * 2.4, 0, TAU);
      c.fill();
    }
  }

  /**
   * 枪口焰：沿朝向甩出的锯齿星芒（先炸开、再收起）+ 一团回卷的硝烟。
   * 炮击最猛（长焰 + 大团墨烟），激光是冷光细芒 + 白芯，燎原（k=3）是往外泼的长火舌，
   * 其余是小火花。
   * 这一笔「有开火的感觉」一半来自星芒的长短错落，另一半来自先张后收的节奏。
   */
  function drawMuzzleFx(c, e, age) {
    const fade = 1 - age;
    const sz = clamp(e.r / 14, 0.7, 1.7);
    const kk = e.k;
    const laser = kk === 4;
    const shell = kk === 2;
    const fire = kk === 3;
    // 燎原：火舌要「泼」出去，所以冲得比别的枪口远、张得也更开
    const reach = (shell ? 34 : fire ? 32 : kk === 1 ? 12 : laser ? 30 : 22) * sz;
    const fan = laser ? 0.45 : shell ? 1.5 : fire ? 1.3 : 1.05;
    const open = 1 - Math.pow(1 - age, 3);
    const bounce = age < 0.32 ? age / 0.32 : 1 - ((age - 0.32) / 0.68) * 0.9;
    const core = laser ? '#f4fbff' : '#f6ead0';
    const hot = laser ? TYPE_ACCENT.laser : shell || fire ? '#e0a03c' : '#d8a24a';
    const puff = e.seed;
    // ① 硝烟：往枪口反方向回卷的墨烟（炮击最浓）
    for (let i = 0; i < (shell ? 3 : 2); i++) {
      const back = (8 + fxRnd(puff, i) * 10) * sz * (0.5 + bounce);
      const side = (fxRnd(puff, i + 5) - 0.5) * 12 * sz;
      c.fillStyle = hexAlpha(INK, (shell ? 0.22 : 0.15) * fade);
      inkBlobPath(
        c,
        e.x - Math.cos(e.a) * back - Math.sin(e.a) * side,
        e.y - Math.sin(e.a) * back + Math.cos(e.a) * side,
        (4.5 + fxRnd(puff, i + 11) * 4) * sz * (0.6 + bounce),
        puff + i,
        { lobes: 7, jitter: 0.6 }
      );
      c.fill();
    }
    // ② 星芒：以朝向为中心、长短不一的锯齿尖刺
    const n = shell ? 7 : fire ? 6 : 5;
    c.fillStyle = hexAlpha(hot, 0.85 * bounce);
    for (let i = 0; i < n; i++) {
      const a = e.a + (i / (n - 1) - 0.5) * fan;
      const len = reach * (0.45 + fxRnd(puff, i + 23) * 0.75) * (0.35 + open * 0.65);
      const wid = (shell ? 3.2 : 2.2) * sz * (1 - age * 0.6);
      c.beginPath();
      c.moveTo(e.x + Math.cos(a + 1.5) * wid, e.y + Math.sin(a + 1.5) * wid);
      c.lineTo(e.x + Math.cos(a) * len, e.y + Math.sin(a) * len);
      c.lineTo(e.x + Math.cos(a - 1.5) * wid, e.y + Math.sin(a - 1.5) * wid);
      c.closePath();
      c.fill();
    }
    // ③ 焰芯：外热内亮的双层墨团
    inkBlobPath(c, e.x, e.y, (shell ? 6.5 : 4.4) * sz * (0.5 + bounce), puff + 41, { lobes: 7, jitter: 0.5 });
    c.fillStyle = hexAlpha(core, 0.9 * bounce);
    c.fill();
    inkBlobPath(c, e.x, e.y, (shell ? 3.4 : 2.3) * sz * (0.4 + bounce * 0.8), puff + 43, { lobes: 6, jitter: 0.55 });
    c.fillStyle = hexAlpha(laser ? '#ffffff' : '#fff6dd', 0.95 * bounce);
    c.fill();
  }

  /**
   * 命中炸开：像水球拍在地上 —— 主体一团不规则墨先铺开，
   * 外围的飞溅沿命中方向甩成扇面，越远越小越淡。
   */
  function drawSplatFx(c, e, age) {
    const fade = 1 - age;
    const big = e.k === 2 || e.k === 4 ? 1.7 : e.k === 3 ? 1.25 : 1;
    const grow = 1 - Math.pow(1 - age, 2);
    // e.col 只在 docs 特效图谱页用（那边的 meta 是空的，playerColor 会全落到墨色）
    const col = e.col || playerColor(e.oi);
    c.fillStyle = hexAlpha(INK, 0.4 * fade);
    inkBlobPath(c, e.x, e.y, (6 + grow * 9) * big, e.seed, { lobes: 9, jitter: 0.52, sy: 0.82, rot: e.a });
    c.fill();
    // 炸开的归属色内芯用固定 30%：不随动画滑进「弹痕」那档不透明度，
    // 否则「炸开」与「留痕」两层在观感与断言上都分不清
    c.fillStyle = hexAlpha(col, 0.3);
    inkBlobPath(c, e.x, e.y, (3.6 + grow * 5.5) * big, e.seed + 11, { lobes: 7, jitter: 0.62, sy: 0.78, rot: e.a });
    c.fill();
    const n = 6 + Math.round(fxRnd(e.seed, 1) * 3);
    for (let i = 0; i < n; i++) {
      const a = e.a + (fxRnd(e.seed, i + 2) - 0.5) * 2.4;
      const d = (14 + fxRnd(e.seed, i + 21) * 30 * big) * grow;
      c.fillStyle = hexAlpha(i % 3 ? INK : col, 0.5 * fade);
      c.beginPath();
      c.arc(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d * 0.85, (1.1 + fxRnd(e.seed, i + 31) * 2.2) * fade * big, 0, TAU);
      c.fill();
    }
  }

  function drawEffects(t) {
    const c = ctx;
    for (let i = effects.length - 1; i >= 0; i--) {
      const e = effects[i];
      const age = (t - e.born) / e.ttl;
      if (age >= 1) {
        effects.splice(i, 1);
        continue;
      }
      const fade = 1 - age;
      if (e.kind === 'splash') {
        // 阵亡墨溅
        c.fillStyle = hexAlpha(INK, 0.4 * fade);
        for (const d of e.dots) {
          c.beginPath();
          c.arc(e.x + d[0] * age * 1.4, e.y + d[1] * age * 1.4, d[2] * (0.6 + fade * 0.4), 0, TAU);
          c.fill();
        }
      } else if (e.kind === 'evo') {
        // 进化：扩散墨环 + 破茧点
        const col = playerColor(e.oi);
        c.strokeStyle = hexAlpha(col, 0.85 * fade);
        c.lineWidth = 3;
        c.beginPath();
        c.arc(e.x, e.y, 10 + age * 34, 0, TAU);
        c.stroke();
        c.strokeStyle = hexAlpha(INK, 0.5 * fade);
        c.lineWidth = 1.6;
        c.beginPath();
        c.arc(e.x, e.y, 4 + age * 20, 0, TAU);
        c.stroke();
        c.fillStyle = hexAlpha(col, 0.9 * fade);
        c.font = '700 ' + Math.round(14 + age * 8) + 'px ' + CALLOUT_FONT;
        c.textAlign = 'center';
        c.fillText('化', e.x, e.y - 26 - age * 12);
      } else if (e.kind === 'cap') {
        // 占领：帅旗色环 + 「取」
        const col = playerColor(e.oi);
        c.strokeStyle = hexAlpha(col, 0.9 * fade);
        c.lineWidth = 5;
        c.beginPath();
        c.arc(e.x, e.y, 40 + age * 50, 0, TAU);
        c.stroke();
        c.fillStyle = hexAlpha(col, 0.95 * fade);
        c.font = '700 26px ' + CALLOUT_FONT;
        c.textAlign = 'center';
        c.fillText('取', e.x, e.y - 66 - age * 14);
      } else if (e.kind === 'lab') {
        // 研究所易主
        const col = playerColor(e.oi);
        c.strokeStyle = hexAlpha(col, 0.85 * fade);
        c.lineWidth = 4;
        c.beginPath();
        c.arc(e.x, e.y, 34 + age * 46, 0, TAU);
        c.stroke();
        c.fillStyle = hexAlpha(col, 0.9 * fade);
        c.font = '700 22px ' + CALLOUT_FONT;
        c.textAlign = 'center';
        c.fillText('研', e.x, e.y - 58 - age * 12);
      } else if (e.kind === 'hqdown') {
        // 总部陷落：大幅墨爆
        const col = playerColor(e.oi);
        c.strokeStyle = hexAlpha(col, 0.7 * fade);
        c.lineWidth = 6;
        c.beginPath();
        c.arc(e.x, e.y, 50 + age * 120, 0, TAU);
        c.stroke();
        c.fillStyle = hexAlpha(INK, 0.3 * fade);
        c.beginPath();
        c.arc(e.x, e.y, 60 * (0.5 + age), 0, TAU);
        c.fill();
        c.fillStyle = hexAlpha('#8a2f22', 0.9 * fade);
        c.font = '700 30px ' + CALLOUT_FONT;
        c.textAlign = 'center';
        c.fillText('陷', e.x, e.y - 80 - age * 20);
      } else if (e.kind === 'boom') {
        drawBoomFx(c, e, age);
      } else if (e.kind === 'muzzle') {
        drawMuzzleFx(c, e, age);
      } else if (e.kind === 'splat') {
        drawSplatFx(c, e, age);
      } else if (e.kind === 'flame') {
        drawFlameFx(c, e, age);
      } else if (e.kind === 'spark') {
        // 弹丸撞山：几道短促的墨痕
        c.strokeStyle = hexAlpha(INK, 0.75 * fade);
        c.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * TAU + age * 1.2;
          const r0 = 2 + age * 7;
          const r1 = r0 + 4 + age * 5;
          c.beginPath();
          c.moveTo(e.x + Math.cos(a) * r0, e.y + Math.sin(a) * r0 * 0.75);
          c.lineTo(e.x + Math.cos(a) * r1, e.y + Math.sin(a) * r1 * 0.75);
          c.stroke();
        }
      }
    }
    // 右键行军标记
    for (let i = moveMarkers.length - 1; i >= 0; i--) {
      const m = moveMarkers[i];
      const age = (t - m.born) / m.ttl;
      if (age >= 1) {
        moveMarkers.splice(i, 1);
        continue;
      }
      const col = playerColor(myPlayerIndex());
      c.strokeStyle = hexAlpha(col, 0.8 * (1 - age));
      c.lineWidth = 2.4;
      c.beginPath();
      c.arc(m.x, m.y, 16 * (1 - age * 0.5), 0, TAU);
      c.stroke();
      c.beginPath();
      c.moveTo(m.x - 6, m.y);
      c.lineTo(m.x + 6, m.y);
      c.moveTo(m.x, m.y - 6);
      c.lineTo(m.x, m.y + 6);
      c.stroke();
    }
    // 右键锁定攻击目标标记（红圈 + 内准星，与移动标记区分）
    for (let i = attackMarkers.length - 1; i >= 0; i--) {
      const m = attackMarkers[i];
      const age = (t - m.born) / m.ttl;
      if (age >= 1) {
        attackMarkers.splice(i, 1);
        continue;
      }
      const a = 1 - age;
      c.strokeStyle = 'rgba(232,86,64,' + (0.9 * a).toFixed(3) + ')';
      c.lineWidth = 2.6;
      c.beginPath();
      c.arc(m.x, m.y, 18 * (1 - age * 0.4), 0, TAU);
      c.stroke();
      c.beginPath();
      for (let k = 0; k < 4; k++) {
        const ang = (k / 4) * TAU;
        c.moveTo(m.x + Math.cos(ang) * 12, m.y + Math.sin(ang) * 12);
        c.lineTo(m.x + Math.cos(ang) * 18, m.y + Math.sin(ang) * 18);
      }
      c.stroke();
    }
    // 追击攻击命令的**常驻**指示（区别于上面 950ms 的点击反馈）：
    // 命令只要还活着就一直画 —— 目标身上一圈缓慢转动的虚线锁定环 + 四角准星，
    // 执行命令且被选中的部队还会拉一条虚线到目标，随时看得出「谁在追谁」。
    // 右键别处 / 停止 / 目标阵亡后服务端不再下发命令 → 指示自动消失。
    if (myPlayerIndex() >= 0) {
      const ordered = new Map(); // key `kind:id` → { kind, id, chasers: [] }
      for (const u of units.values()) {
        if (!u.ok || u.oi !== myPlayerIndex()) continue;
        const key = u.ok + ':' + u.od;
        let it = ordered.get(key);
        if (!it) {
          it = { kind: u.ok, id: u.od, chasers: [] };
          ordered.set(key, it);
        }
        it.chasers.push(u);
      }
      const spin = (t / 620) % 1;
      for (const it of ordered.values()) {
        const tp = targetInfoOf(it.kind, it.id);
        if (!tp) continue;
        // 被选中的执行部队 → 目标：细虚线（追击途中一眼看出目标在哪）
        c.save();
        c.setLineDash([5, 7]);
        c.lineWidth = 1.7;
        c.strokeStyle = 'rgba(216,64,44,0.5)';
        c.beginPath();
        for (const u of it.chasers) {
          if (!selection.has(u.id)) continue;
          c.moveTo(u.x, u.y);
          c.lineTo(tp.x, tp.y);
        }
        c.stroke();
        c.restore();
        // 目标身上的锁定环：虚线随时间转动 + 四角准星
        const rr = tp.r + 13;
        c.save();
        c.translate(tp.x, tp.y);
        c.rotate(spin * TAU);
        c.setLineDash([7, 6]);
        c.lineWidth = 2;
        c.strokeStyle = 'rgba(232,86,64,0.62)';
        c.beginPath();
        c.arc(0, 0, rr, 0, TAU);
